<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../css/style.css?v=1.1" />
  <link rel="stylesheet" href="../../css/tools.css?v=1.1" />
  <link rel="stylesheet" href="../../css/themes/light.css?v=1.1" />
  <link rel="stylesheet" href="../../css/themes/dark.css?v=1.1" />
  <link rel="stylesheet" href="../../css/themes/ocean.css?v=1.1" />
  <script>

    hm.src = "https://hm.baidu.com/hm.js?97abb4f3251f4cef59d6f3b8d246473c";

<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="logo">
        <span class="logo-code">Code</span>
        <span class="logo-json">Json</span>
        <span class="logo-domain">.cn</span>
      </a>
      <div class="nav-links" id="navLinks" data-active="tools"></div>
      <div class="theme-switcher">
        <button type="button" class="theme-btn" data-theme="light">浅色</button>
        <button type="button" class="theme-btn" data-theme="dark">深色</button>
        <button type="button" class="theme-btn" data-theme="ocean">海洋</button>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="tool-page">
      <h1>UUID 生成</h1>
      <p class="tool-desc">批量生成 UUID v4，支持大小写切换，逐行复制或全部复制。</p>

      <div class="tool-app" id="app">
        <div class="toolbar">
          <button class="title-badge" type="button" disabled>UUID</button>
          <div class="toolbar-actions">
            <span class="radio-group">
              <label><input type="radio" name="uuidCase" value="lower" checked><span>小写</span></label>
              <label><input type="radio" name="uuidCase" value="upper"><span>大写</span></label>
            </span>
            <button class="btn-ghost" id="btnClear" type="button">清空</button>
          </div>
        </div>

        <div class="input-bar">
          <label for="countInput">数量</label>
          <input type="number" id="countInput" value="1" min="1" max="1000" />
          <button class="btn-primary-tool" id="btnGenerate" type="button">生成</button>
        </div>

        <div class="output-area">
          <div class="output-header">
            <span class="pane-label">输出</span>
            <button class="icon-btn" id="copyAll" data-tooltip="全部复制" type="button">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
            </button>
          </div>
          <div class="uuid-list" id="uuidList"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__left">
        <p class="footer__copyright">© 2025 codejson.cn 版权所有 | <span class="footer__icp">沪ICP备2025145317号-1</span></p>
      </div>
      <div class="footer__right">
        <ul class="footer__links">
          <li class="footer__item"><a href="../../about/" class="footer__link">关于我们</a></li>
          <li class="footer__item"><a href="../../about/privacy/" class="footer__link">隐私政策</a></li>
          <li class="footer__item"><a href="../../about/terms/" class="footer__link">使用条款</a></li>
          <li class="footer__item"><a href="../../about/contact/" class="footer__link">联系我们</a></li>
          <li class="footer__item"><a href="../../about/copyright/" class="footer__link">版权声明</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="../../js/theme.js?v=1.1"></script>
  <script src="../../js/nav.js?v=1.1" defer></script>
  <script>
    (function () {
      var countInput = document.getElementById('countInput');
      var btnGenerate = document.getElementById('btnGenerate');
      var btnClear = document.getElementById('btnClear');
      var uuidList = document.getElementById('uuidList');
      var copyAll = document.getElementById('copyAll');
      var caseRadios = document.querySelectorAll('input[name="uuidCase"]');

      function getCase() {
        for (var i = 0; i < caseRadios.length; i++) {
          if (caseRadios[i].checked) return caseRadios[i].value;
        }
        return 'lower';
      }

      function generateUUID() {
        if (crypto.randomUUID) {
          return crypto.randomUUID();
        }
        // Fallback for environments without crypto.randomUUID
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0;
          var v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      function applyCase(uuid, c) {
        return c === 'upper' ? uuid.toUpperCase() : uuid.toLowerCase();
      }

      function render() {
        var count = parseInt(countInput.value, 10);
        if (isNaN(count) || count < 1) count = 1;
        if (count > 1000) count = 1000;
        var c = getCase();
        var html = '';
        for (var i = 0; i < count; i++) {
          var uuid = applyCase(generateUUID(), c);
          html += '<div class="uuid-row">' +
            '<span class="uuid-text">' + uuid + '</span>' +
            '<button class="icon-btn copy-single" data-uuid="' + uuid + '" data-tooltip="复制" type="button">' +
            '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>' +
            '</button>' +
            '</div>';
        }
        uuidList.innerHTML = html;
      }

      function getAllUUIDText() {
        var texts = [];
        var rows = uuidList.querySelectorAll('.uuid-text');
        for (var i = 0; i < rows.length; i++) {
          texts.push(rows[i].textContent);
        }
        return texts.join('\n');
      }

      btnGenerate.addEventListener('click', render);

      countInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          render();
        }
      });

      btnClear.addEventListener('click', function () {
        uuidList.innerHTML = '';
        countInput.value = '1';
      });

      copyAll.addEventListener('click', function () {
        var text = getAllUUIDText();
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            copyAll.setAttribute('data-tooltip', '已复制');
            setTimeout(function () { copyAll.setAttribute('data-tooltip', '全部复制'); }, 1200);
          });
        }
      });

      caseRadios.forEach(function (radio) {
        radio.addEventListener('change', function () {
          if (uuidList.children.length > 0) {
            render();
          }
        });
      });

      uuidList.addEventListener('click', function (e) {
        var btn = e.target.closest('.copy-single');
        if (btn) {
          var uuid = btn.dataset.uuid;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(uuid).then(function () {
              btn.setAttribute('data-tooltip', '已复制');
              setTimeout(function () { btn.setAttribute('data-tooltip', '复制'); }, 1200);
            });
          }
        }
      });

      // Generate one UUID by default
      render();
    })();
  </script>
</body>
</html>
