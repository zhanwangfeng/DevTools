  <main class="container">

      <h1>MD5 哈希</h1>
      <p class="tool-desc">输入文本实时计算 MD5 哈希值，支持大小写切换。</p>

      <div class="tool-app" id="app">
        <div class="toolbar">
          <button class="title-badge" type="button" disabled>MD5</button>
          <div class="toolbar-actions">
            <span class="radio-group">
              <label><input type="radio" name="md5Case" value="lower" checked><span>小写</span></label>
              <label><input type="radio" name="md5Case" value="upper"><span>大写</span></label>
            </span>
            <label><input type="checkbox" id="cbWrap"><span>自动换行</span></label>
            <button class="btn-ghost" id="btnSample" type="button">示例</button>
            <button class="btn-ghost" id="btnClear" type="button">清空</button>
          </div>
        </div>

        <div class="hash-row">
          <span class="hash-label">MD5</span>
          <button class="icon-btn" id="copyHash" data-tooltip="复制" type="button">

  <script>
    (function () {
      var textInput = document.getElementById('textInput');
      var hashValue = document.getElementById('hashValue');
      var copyHash = document.getElementById('copyHash');
      var cbWrap = document.getElementById('cbWrap');
      var btnSample = document.getElementById('btnSample');
      var btnClear = document.getElementById('btnClear');
      var caseRadios = document.querySelectorAll('input[name="md5Case"]');

      function getCase() {
        for (var i = 0; i < caseRadios.length; i++) {
          if (caseRadios[i].checked) return caseRadios[i].value;
        }
        return 'lower';
      }

      function computeHash() {
        var text = textInput.value;
        if (!text) {
          hashValue.value = '';
          return;
        }
        var hash = md5(text);
        if (getCase() === 'upper') {
          hash = hash.toUpperCase();
        }
        hashValue.value = hash;
      }

      cbWrap.addEventListener('change', function () {
        document.body.classList.toggle('wrap', cbWrap.checked);
      });

      caseRadios.forEach(function (radio) {
        radio.addEventListener('change', computeHash);
      });

      textInput.addEventListener('input', computeHash);

      btnSample.addEventListener('click', function () {
        textInput.value = 'Hello, MD5!\n你好，世界！';
        computeHash();
      });

      btnClear.addEventListener('click', function () {
        textInput.value = '';
        hashValue.value = '';
        textInput.focus();
      });

      copyHash.addEventListener('click', function () {
        var text = hashValue.value;
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            copyHash.setAttribute('data-tooltip', '已复制');
            setTimeout(function () { copyHash.setAttribute('data-tooltip', '复制'); }, 1200);
          });
        }
      });
    })();
  </script>
