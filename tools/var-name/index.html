  <main class="container">
    <section class="tool-page">
      <h1>变量名转换</h1>
      <p class="tool-desc">输入变量名，实时输出 camelCase、snake_case、kebab-case、PascalCase、CONSTANT_CASE 五种风格。</p>

      <div class="tool-app" id="app">
        <div class="toolbar">
          <button class="title-badge" type="button" disabled>VarName</button>
          <div class="toolbar-actions">
            <button class="btn-ghost" id="btnSample" type="button">示例</button>
            <button class="btn-ghost" id="btnClear" type="button">清空</button>
          </div>
        </div>

        <div class="input-section">
          <input class="tool-input" id="nameInput" type="text" placeholder="输入变量名，如 some_variableName-Test" spellcheck="false" autofocus />
        </div>

        <div class="formats">
          <div class="format-row">
            <span class="format-label">camelCase</span>
            <input class="format-output" id="camelOut" readonly />
            <button class="icon-btn" data-tooltip="复制" type="button" data-copy="camelOut">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
            </button>
          </div>
          <div class="format-row">
            <span class="format-label">snake_case</span>
            <input class="format-output" id="snakeOut" readonly />
            <button class="icon-btn" data-tooltip="复制" type="button" data-copy="snakeOut">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
            </button>
          </div>
          <div class="format-row">
            <span class="format-label">kebab-case</span>
            <input class="format-output" id="kebabOut" readonly />
            <button class="icon-btn" data-tooltip="复制" type="button" data-copy="kebabOut">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
            </button>
          </div>
          <div class="format-row">
            <span class="format-label">PascalCase</span>
            <input class="format-output" id="pascalOut" readonly />
            <button class="icon-btn" data-tooltip="复制" type="button" data-copy="pascalOut">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
            </button>
          </div>
          <div class="format-row">
            <span class="format-label">CONSTANT_CASE</span>
            <input class="format-output" id="constantOut" readonly />
            <button class="icon-btn" data-tooltip="复制" type="button" data-copy="constantOut">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>

  <script src="../../js/theme.js"></script>
  <script>
    (function () {
      var input = document.getElementById('nameInput');
      var camelOut = document.getElementById('camelOut');
      var snakeOut = document.getElementById('snakeOut');
      var kebabOut = document.getElementById('kebabOut');
      var pascalOut = document.getElementById('pascalOut');
      var constantOut = document.getElementById('constantOut');

      /* 将输入拆分为单词数组 */
      function tokenize(str) {
        if (!str) return [];
        // 1. 按分隔符拆分（- _ . 空格）
        var parts = str.split(/[-_.\s]+/);
        var words = [];
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (!p) continue;
          // 2. 在每个部分内，按大写字母拆分（处理 camelCase 和 PascalCase）
          var sub = p.replace(/([a-z])([A-Z])/g, '$1\0$2')
                    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1\0$2')
                    .split('\0');
          for (var j = 0; j < sub.length; j++) {
            var w = sub[j].toLowerCase();
            if (w) words.push(w);
          }
        }
        return words;
      }

      function update() {
        var raw = input.value;
        var words = tokenize(raw);
        if (words.length === 0) {
          camelOut.value = '';
          snakeOut.value = '';
          kebabOut.value = '';
          pascalOut.value = '';
          constantOut.value = '';
          return;
        }

        // camelCase
        camelOut.value = words[0] + words.slice(1).map(function (w) {
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join('');

        // snake_case
        snakeOut.value = words.join('_');

        // kebab-case
        kebabOut.value = words.join('-');

        // PascalCase
        pascalOut.value = words.map(function (w) {
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join('');

        // CONSTANT_CASE
        constantOut.value = words.join('_').toUpperCase();
      }

      input.addEventListener('input', update);

      document.getElementById('btnSample').addEventListener('click', function () {
        input.value = 'some_variableName-Test';
        update();
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        input.value = '';
        camelOut.value = '';
        snakeOut.value = '';
        kebabOut.value = '';
        pascalOut.value = '';
        constantOut.value = '';
        input.focus();
      });

      /* 复制 */
      document.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-copy');
          var el = document.getElementById(id);
          var text = el.value;
          if (!text) return;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function () {
              btn.setAttribute('data-tooltip', '已复制');
              setTimeout(function () { btn.setAttribute('data-tooltip', '复制'); }, 1200);
            });
          }
        });
      });

      /* 初始更新 */
      update();
    })();
  </script>
