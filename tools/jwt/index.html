  <main class="container">
    <section class="tool-page">
      <h1>JWT 解码</h1>
      <p class="tool-desc">输入 JWT Token，在线解码查看 Header、Payload、Signature 内容。</p>

      <div class="tool-app" id="app">
        <div class="toolbar">
          <button class="title-badge" type="button" disabled>JWT</button>
          <div class="toolbar-actions">
            <button class="btn-ghost" id="btnSample" type="button">示例</button>
            <button class="btn-ghost" id="btnClear" type="button">清空</button>
          </div>
        </div>

        <div class="input-section">
          <textarea class="tool-textarea" id="tokenInput" rows="3" placeholder="在此粘贴 JWT Token…" spellcheck="false" autofocus style="resize: none; min-height: 60px; border: 1px solid var(--border); border-radius: 6px; width: 100%; box-sizing: border-box;"></textarea>
        </div>

        <div class="error-line" id="errorLine"></div>

        <div class="result-section" style="flex: 1 1 auto; overflow-y: auto; padding: 8px 12px;">
          <div style="margin-bottom: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
              <span class="pane-label">HEADER</span>
              <button class="icon-btn" data-tooltip="复制" type="button" data-copy="headerResult">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
              </button>
            </div>
            <pre class="result-json" id="headerResult" style="margin: 0;">-</pre>
          </div>
          <div style="margin-bottom: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
              <span class="pane-label">PAYLOAD</span>
              <button class="icon-btn" data-tooltip="复制" type="button" data-copy="payloadResult">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
              </button>
            </div>
            <pre class="result-json" id="payloadResult" style="margin: 0;">-</pre>
          </div>
          <div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
              <span class="pane-label">SIGNATURE</span>
              <button class="icon-btn" data-tooltip="复制" type="button" data-copy="signatureResult">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>

  <script>
    (function () {
      var tokenInput = document.getElementById('tokenInput');
      var headerResult = document.getElementById('headerResult');
      var payloadResult = document.getElementById('payloadResult');
      var signatureResult = document.getElementById('signatureResult');
      var errorLine = document.getElementById('errorLine');

      function base64UrlDecode(str) {
        var base64 = str.replace(/-/g, '+').replace(/_/g, '/');
        // 补足 padding
        while (base64.length % 4 !== 0) base64 += '=';
        try {
          var bin = atob(base64);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return new TextDecoder().decode(bytes);
        } catch (e) {
          return null;
        }
      }

      function formatJson(str) {
        try {
          return JSON.stringify(JSON.parse(str), null, 2);
        } catch (e) {
          return str;
        }
      }

      function decode() {
        var raw = tokenInput.value.trim();
        if (!raw) {
          errorLine.classList.remove('show');
          headerResult.textContent = '-';
          payloadResult.textContent = '-';
          signatureResult.textContent = '-';
          return;
        }

        var parts = raw.split('.');
        if (parts.length !== 3) {
          errorLine.textContent = '无效的 JWT Token：格式应为 Header.Payload.Signature 三段式';
          errorLine.classList.add('show');
          headerResult.textContent = '-';
          payloadResult.textContent = '-';
          signatureResult.textContent = '-';
          return;
        }

        errorLine.classList.remove('show');

        // Header
        var headerDecoded = base64UrlDecode(parts[0]);
        headerResult.textContent = headerDecoded ? formatJson(headerDecoded) : '（解码失败）';

        // Payload
        var payloadDecoded = base64UrlDecode(parts[1]);
        payloadResult.textContent = payloadDecoded ? formatJson(payloadDecoded) : '（解码失败）';

        // Signature
        signatureResult.textContent = parts[2];
      }

      tokenInput.addEventListener('input', decode);

      document.getElementById('btnSample').addEventListener('click', function () {
        tokenInput.value = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkNvZGVLaXQiLCJpYXQiOjE3MDAwMDAwMDB9.a_dCFmbWWXCMsVH4HVH_1siRIhzXGgO0KZPud-sIUXo';
        decode();
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        tokenInput.value = '';
        headerResult.textContent = '-';
        payloadResult.textContent = '-';
        signatureResult.textContent = '-';
        errorLine.classList.remove('show');
        tokenInput.focus();
      });

      /* 复制 */
      document.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-copy');
          var el = document.getElementById(id);
          var text = el.textContent;
          if (!text || text === '-') return;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function () {
              btn.setAttribute('data-tooltip', '已复制');
              setTimeout(function () { btn.setAttribute('data-tooltip', '复制'); }, 1200);
            });
          }
        });
      });
    })();
  </script>
