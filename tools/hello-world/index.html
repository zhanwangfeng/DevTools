          <button type="button" class="btn btn-secondary lang-pill" data-lang="cpp">C++</button>

  <script src="../../js/theme.js"></script>
  <script>
    var snippets = {
      javascript: 'console.log("Hello, World!");',
      python: 'print("Hello, World!")',
      java:
        'public class Main {\n' +
        '    public static void main(String[] args) {\n' +
        '        System.out.println("Hello, World!");\n' +
        '    }\n' +
        '}',
      golang:
        'package main\n\n' +
        'import "fmt"\n\n' +
        'func main() {\n' +
        '    fmt.Println("Hello, World!")\n' +
        '}',
      rust:
        'fn main() {\n' +
        '    println!("Hello, World!");\n' +
        '}',
      cpp:
        '#include <iostream>\n\n' +
        'int main() {\n' +
        '    std::cout << "Hello, World!" << std::endl;\n' +
        '    return 0;\n' +
        '}',
      c:
        '#include <stdio.h>\n\n' +
        'int main() {\n' +
        '    printf("Hello, World!\\n");\n' +
        '    return 0;\n' +
        '}',
      swift: 'print("Hello, World!")'
    };

    var style = document.createElement("style");
    style.textContent =
      "@keyframes hwWave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }";
    document.head.appendChild(style);

    var langPills = document.querySelectorAll(".lang-pill");
    var codePreview = document.getElementById("codePreview");
    var langTitle = document.getElementById("langTitle");
    var copyBtn = document.getElementById("copyBtn");
    var copyTip = document.getElementById("copyTip");
    var activeLang = "javascript";

    function setLang(lang) {
      activeLang = lang;
      codePreview.textContent = snippets[lang];
      langTitle.textContent = lang.charAt(0).toUpperCase() + lang.slice(1);
      langPills.forEach(function (b) {
        if (b.dataset.lang === lang) {
          b.classList.add("active");
          b.style.borderColor = "var(--accent)";
          b.style.color = "var(--accent)";
        } else {
          b.classList.remove("active");
          b.style.borderColor = "";
          b.style.color = "";
        }
      });
    }

    langPills.forEach(function (btn) {
      btn.addEventListener("click", function () { setLang(btn.dataset.lang); });
    });

    copyBtn.addEventListener("click", function () {
      var text = codePreview.textContent;
      function done() {
        copyTip.style.display = "block";
        setTimeout(function () { copyTip.style.display = "none"; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      }
    });

    setLang("javascript");
  </script>
