      <div class="tool-app" id="app">
        <div class="toolbar">
          <button class="title-badge" type="button" disabled>Base64</button>
          <div class="toolbar-actions">
            <label><input type="checkbox" id="cbWrap" checked><span>自动换行</span></label>
            <label><input type="checkbox" id="cbLines"><span>行号</span></label>

              <div class="gutter" id="gutterLeft"></div>

            <div class="pane-header">

              <button class="icon-btn" id="copyRight" data-tooltip="复制" type="button">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 2h7v2H4V2zm-1 3h9v1H3V5zm0 2h9v7H3V7zm1 1v5h7V8H4z"/></svg>
              </button>
            </div>
            <div class="editor" id="editorRight">
              <div class="gutter" id="gutterRight"></div>
              <textarea class="tool-textarea" id="right" placeholder="或在此粘贴 Base64 文本进行解码…" spellcheck="false"></textarea>
            </div>

  <script src="../../js/theme.js?v=1.0"></script>
  <script>
    (function () {
      var left = document.getElementById('left');
      var right = document.getElementById('right');
      var gutterLeft = document.getElementById('gutterLeft');
      var gutterRight = document.getElementById('gutterRight');
      var editorLeft = document.getElementById('editorLeft');
      var editorRight = document.getElementById('editorRight');
      var errorIndicator = document.getElementById('errorIndicator');
      var errorDetail = document.getElementById('errorDetail');
      var cbWrap = document.getElementById('cbWrap');
      var cbLines = document.getElementById('cbLines');
      var syncSource = null;

      cbWrap.addEventListener('change', function () {
        document.body.classList.toggle('wrap', cbWrap.checked);
      });
      document.body.classList.toggle('wrap', cbWrap.checked);

      function updateGutter(textarea, gutter) {
        var lines = textarea.value.split('\n').length;
        var html = '';
        for (var i = 1; i <= lines; i++) html += i + '\n';
        gutter.textContent = html;
      }
      function applyLineNumbers() {
        var show = cbLines.checked;
        editorLeft.classList.toggle('show-gutter', show);
        editorRight.classList.toggle('show-gutter', show);
        if (show) {
          updateGutter(left, gutterLeft);
          updateGutter(right, gutterRight);
        }
      }
      cbLines.addEventListener('change', applyLineNumbers);
      left.addEventListener('scroll', function () { gutterLeft.scrollTop = left.scrollTop; });
      right.addEventListener('scroll', function () { gutterRight.scrollTop = right.scrollTop; });

      function encodeBase64(text) {
        var bytes = new TextEncoder().encode(text);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function decodeBase64(text) {
        var bin = atob(text.trim());
        var bytes = new Uint8Array(bin.length);
        for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
        return new TextDecoder().decode(bytes);
      }

      function showDecodeError(msg) {
        errorDetail.textContent = msg;
        errorIndicator.classList.add('show');
      }
      function hideError() { errorIndicator.classList.remove('show'); }

      function refreshGutters() {
        if (cbLines.checked) {
          updateGutter(left, gutterLeft);
          updateGutter(right, gutterRight);
        }
      }

      var leftTimer = null;
      left.addEventListener('input', function () {
        clearTimeout(leftTimer);
        leftTimer = setTimeout(function () {
          syncSource = 'left';
          hideError();
          try { right.value = encodeBase64(left.value); } catch (e) { right.value = ''; }
          refreshGutters();
          syncSource = null;
        }, 150);
      });

      var rightTimer = null;
      right.addEventListener('input', function () {
        clearTimeout(rightTimer);
        rightTimer = setTimeout(function () {
          if (syncSource === 'left') return;
          syncSource = 'right';
          var text = right.value.trim();
          if (!text) { left.value = ''; hideError(); refreshGutters(); syncSource = null; return; }
          try {
            left.value = decodeBase64(text);
            hideError();
          } catch (e) {
            left.value = '';
            showDecodeError(e && e.message ? e.message : String(e));
          }
          refreshGutters();
          syncSource = null;
        }, 150);
      });

      document.getElementById('btnSample').addEventListener('click', function () {
        var sample = 'Hello, Base64!\n你好，世界！\nBase64 编码测试 / Encoding test';
        left.value = sample;
        hideError();
        try { right.value = encodeBase64(sample); } catch (e) { right.value = ''; }
        refreshGutters();
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        left.value = '';
        right.value = '';
        hideError();
        refreshGutters();
        left.focus();
      });

      function bindCopy(btnId, source) {
        var btn = document.getElementById(btnId);
        btn.addEventListener('click', function () {
          var text = source.value;
          if (!text) return;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function () {
              btn.setAttribute('data-tooltip', '已复制');
              setTimeout(function () { btn.setAttribute('data-tooltip', '复制'); }, 1200);
            });
          }
        });
      }
      bindCopy('copyLeft', left);
      bindCopy('copyRight', right);
    })();
  </script>
