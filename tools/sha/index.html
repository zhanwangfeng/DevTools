  <script>
    (function () {
      var textInput = document.getElementById('textInput');
      var hashValue = document.getElementById('hashValue');
      var hashLabel = document.getElementById('hashLabel');
      var copyHash = document.getElementById('copyHash');
      var cbWrap = document.getElementById('cbWrap');
      var algoSelect = document.getElementById('algoSelect');
      var btnSample = document.getElementById('btnSample');
      var btnClear = document.getElementById('btnClear');

      var computeTimer = null;
      var pendingCompute = false;

      cbWrap.addEventListener('change', function () {
        document.body.classList.toggle('wrap', cbWrap.checked);
      });

      function hexFromBuffer(buffer) {
        var bytes = new Uint8Array(buffer);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          hex += bytes[i].toString(16).padStart(2, '0');
        }
        return hex;
      }

      function computeHash() {
        var text = textInput.value;
        if (!text) {
          hashValue.value = '';
          return;
        }
        var algo = algoSelect.value;
        hashLabel.textContent = algo;
        var encoder = new TextEncoder();
        var data = encoder.encode(text);
        crypto.subtle.digest(algo, data).then(function (buffer) {
          var hex = hexFromBuffer(buffer);
          hashValue.value = hex;
        }).catch(function (err) {
          hashValue.value = '错误: ' + err.message;
        });
      }

      function scheduleCompute() {
        if (computeTimer) {
          clearTimeout(computeTimer);
        }
        computeTimer = setTimeout(function () {
          computeHash();
          computeTimer = null;
          if (pendingCompute) {
            pendingCompute = false;
            scheduleCompute();
          }
        }, 150);
      }

      algoSelect.addEventListener('change', function () {
        hashLabel.textContent = algoSelect.value;
        computeHash();
      });

      textInput.addEventListener('input', scheduleCompute);

      btnSample.addEventListener('click', function () {
        textInput.value = 'Hello, SHA!\n你好，世界！';
        computeHash();
      });

      btnClear.addEventListener('click', function () {
        textInput.value = '';
        hashValue.value = '';
        textInput.focus();
      });

      copyHash.addEventListener('click', function () {
        var text = hashValue.value;
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            copyHash.setAttribute('data-tooltip', '已复制');
            setTimeout(function () { copyHash.setAttribute('data-tooltip', '复制'); }, 1200);
          });
        }
      });
    })();
  </script>
