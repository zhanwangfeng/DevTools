  <main class="container">
    <section class="tool-page">
      <h1>Unix 时间戳</h1>
      <p class="tool-desc">当前时间戳实时显示、时区选择、时间戳与日期互转。</p>

      <div class="tool-app" id="app" style="height:auto;max-height:none;overflow-y:auto;padding:12px 0;">
        <div class="toolbar" style="margin:0 0 12px;">
          <button class="title-badge" type="button" disabled>Unix 时间戳</button>
          <div class="toolbar-actions">
            <label><input type="radio" name="precision" value="s" checked><span>秒</span></label>
            <label><input type="radio" name="precision" value="ms"><span>毫秒</span></label>
          </div>
        </div>

        <!-- 当前时间戳 -->
        <div class="section" style="padding:0 12px;">
          <div class="section-title">当前时间戳</div>
          <div class="card">
            <div class="card-row">
              <input class="card-value" id="currentStamp" readonly>
              <button class="btn-ghost" id="copyCurrent" type="button" style="flex-shrink:0;">复制</button>
            </div>
          </div>
        </div>

        <!-- 时区选择 -->
        <div class="section" style="padding:0 12px;">
          <div class="card">
            <div class="tz-row">
              <label>时区</label>
              <select class="tz-select" id="tzSelect"></select>
            </div>
          </div>
        </div>

        <!-- 时间戳 → 日期 -->
        <div class="section" style="padding:0 12px;">
          <div class="section-title">时间戳 → 日期</div>
          <div class="card">
            <div class="card-row">
              <input class="card-value" id="tsInput" placeholder="输入时间戳…" spellcheck="false">
              <button class="btn-ghost" id="btnToDate" type="button">转换</button>
            </div>
            <div class="card-row output-row">
              <input class="card-value" id="dateOutput" readonly>
              <button class="btn-ghost" id="copyDate" type="button" style="flex-shrink:0;">复制</button>
            </div>
          </div>
        </div>

        <!-- 日期 → 时间戳（逐项） -->
        <div class="section" style="padding:0 12px;">
          <div class="section-title">日期 → 时间戳（逐项）</div>
          <div class="card">
            <div class="card-row">
              <div class="date-row">
                <div class="date-field"><input id="inY" type="text" maxlength="4" placeholder="YYYY"><span class="unit">年</span></div>
                <span class="sep">-</span>
                <div class="date-field"><input id="inMo" type="text" maxlength="2" placeholder="MM"><span class="unit">月</span></div>
                <span class="sep">-</span>
                <div class="date-field"><input id="inD" type="text" maxlength="2" placeholder="DD"><span class="unit">日</span></div>
                <span class="sep">&nbsp;&nbsp;</span>
                <div class="date-field"><input id="inH" type="text" maxlength="2" placeholder="HH"><span class="unit">时</span></div>
                <span class="sep">:</span>
                <div class="date-field"><input id="inMi" type="text" maxlength="2" placeholder="MM"><span class="unit">分</span></div>
                <span class="sep">:</span>
                <div class="date-field"><input id="inS" type="text" maxlength="2" placeholder="SS"><span class="unit">秒</span></div>
              </div>
              <button class="btn-ghost" id="btnStampIndividual" type="button">转换</button>
            </div>
            <div class="card-row output-row">
              <input class="card-value" id="stampOutput" readonly>
              <button class="btn-ghost" id="copyStamp" type="button" style="flex-shrink:0;">复制</button>
            </div>
          </div>
        </div>

        <!-- 日期 → 时间戳（快速） -->
        <div class="section" style="padding:0 12px;">
          <div class="section-title">日期 → 时间戳（快速）</div>
          <div class="card">
            <div class="card-row">
              <input class="card-value" id="quickInput" placeholder="YYYYMMDDHHMMSS" spellcheck="false">
              <button class="btn-ghost" id="btnQuick" type="button">转换</button>
            </div>
            <div class="card-row output-row">
              <input class="card-value" id="quickOutput" readonly>
              <button class="btn-ghost" id="copyQuick" type="button" style="flex-shrink:0;">复制</button>
            </div>
          </div>
        </div>

  <script src="../../js/theme.js?v=1.0"></script>
  <script>
    (function () {
      // —— 时区数据：GMT-12 到 GMT+12 ——
      var tzEntries = [
        { off: -12, city: '贝克岛' },
        { off: -11, city: '美属萨摩亚' },
        { off: -10, city: '夏威夷' },
        { off: -9, city: '阿拉斯加' },
        { off: -8, city: '太平洋时间' },
        { off: -7, city: '山地时间' },
        { off: -6, city: '中部时间' },
        { off: -5, city: '东部时间' },
        { off: -4, city: '大西洋时间' },
        { off: -3, city: '布宜诺斯艾利斯' },
        { off: -2, city: '中大西洋' },
        { off: -1, city: '亚速尔群岛' },
        { off: 0, city: '格林尼治' },
        { off: 1, city: '中欧时间' },
        { off: 2, city: '东欧时间' },
        { off: 3, city: '莫斯科' },
        { off: 4, city: '迪拜' },
        { off: 5, city: '伊斯兰堡' },
        { off: 6, city: '达卡' },
        { off: 7, city: '曼谷' },
        { off: 8, city: '北京' },
        { off: 9, city: '东京' },
        { off: 10, city: '悉尼' },
        { off: 11, city: '所罗门群岛' },
        { off: 12, city: '奥克兰' }
      ];

      var tzSelect = document.getElementById('tzSelect');
      var localOffset = -new Date().getTimezoneOffset() / 60;

      // 构建时区下拉
      function buildTimezoneOptions() {
        tzSelect.innerHTML = '';
        tzEntries.forEach(function (entry) {
          var opt = document.createElement('option');
          opt.value = String(entry.off);
          var sign = entry.off >= 0 ? '+' : '';
          opt.textContent = '(GMT' + sign + entry.off + ') ' + entry.city;
          if (entry.off === localOffset) opt.selected = true;
          tzSelect.appendChild(opt);
        });
      }
      buildTimezoneOptions();

      function currentOffset() { return parseInt(tzSelect.value, 10) || 0; }

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      // 时间戳 → 指定偏移的墙上时间
      function timestampToWall(offsetHours, ms) {
        var d = new Date(ms + offsetHours * 3600000);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
          pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
      }

      // 指定偏移的墙上时间 → 时间戳
      function wallToTimestamp(offsetHours, y, mo, d, h, mi, s) {
        return Date.UTC(y, mo - 1, d, h, mi, s) - offsetHours * 3600000;
      }

      // —— 当前时间戳：每秒刷新 ——
      var currentStamp = document.getElementById('currentStamp');
      var precision = 's';
      function refreshCurrent() {
        var now = Date.now();
        currentStamp.value = precision === 'ms' ? String(now) : String(Math.floor(now / 1000));
      }
      document.querySelectorAll('input[name="precision"]').forEach(function (r) {
        r.addEventListener('change', function (e) { precision = e.target.value; refreshCurrent(); });
      });
      refreshCurrent();
      setInterval(refreshCurrent, 1000);

      // —— 复制 ——
      function bindCopy(btnId, textFn) {
        var btn = document.getElementById(btnId);
        btn.addEventListener('click', function () {
          var text = textFn();
          if (!text) return;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function () {
              var old = btn.textContent;
              btn.textContent = '已复制';
              setTimeout(function () { btn.textContent = old; }, 1200);
            });
          }
        });
      }
      bindCopy('copyCurrent', function () { return currentStamp.value; });
      bindCopy('copyDate', function () { return document.getElementById('dateOutput').value; });
      bindCopy('copyStamp', function () { return document.getElementById('stampOutput').value; });
      bindCopy('copyQuick', function () { return document.getElementById('quickOutput').value; });

      // —— 时间戳 → 日期 ——
      function toDate() {
        var input = document.getElementById('tsInput');
        var output = document.getElementById('dateOutput');
        var text = input.value.trim();
        if (!text) { output.value = ''; output.classList.remove('output-error'); return; }
        var num = Number(text);
        if (isNaN(num)) { output.value = '无效时间戳'; output.classList.add('output-error'); return; }
        var ms = num;
        if (/^\d+$/.test(text) && Math.abs(num) < 1e12) ms = num * 1000;
        var d = new Date(ms);
        if (isNaN(d.getTime())) { output.value = '无效时间戳'; output.classList.add('output-error'); return; }
        output.classList.remove('output-error');
        output.value = timestampToWall(currentOffset(), ms);
      }
      document.getElementById('btnToDate').addEventListener('click', toDate);
      document.getElementById('tsInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') toDate(); });

      // —— 日期 → 时间戳（逐项） ——
      function toStampIndividual() {
        var y = parseInt(document.getElementById('inY').value, 10);
        var mo = parseInt(document.getElementById('inMo').value, 10);
        var d = parseInt(document.getElementById('inD').value, 10);
        var h = parseInt(document.getElementById('inH').value, 10);
        var mi = parseInt(document.getElementById('inMi').value, 10);
        var s = parseInt(document.getElementById('inS').value, 10);
        var output = document.getElementById('stampOutput');
        if ([y, mo, d, h, mi, s].some(function (v) { return isNaN(v); })) {
          output.value = '请填写完整的日期时间';
          output.classList.add('output-error');
          return;
        }
        var ts = wallToTimestamp(currentOffset(), y, mo, d, h, mi, s);
        if (isNaN(ts)) { output.value = '无效日期'; output.classList.add('output-error'); return; }
        output.classList.remove('output-error');
        output.value = Math.floor(ts / 1000) + '  /  ' + ts + '  (s / ms)';
      }
      document.getElementById('btnStampIndividual').addEventListener('click', toStampIndividual);
      ['inY', 'inMo', 'inD', 'inH', 'inMi', 'inS'].forEach(function (id) {
        document.getElementById(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') toStampIndividual(); });
      });

      // —— 日期 → 时间戳（快速） ——
      function toStampQuick() {
        var input = document.getElementById('quickInput');
        var output = document.getElementById('quickOutput');
        var text = input.value.trim();
        if (!text) { output.value = ''; output.classList.remove('output-error'); return; }
        if (!/^\d{14}$/.test(text)) { output.value = '格式错误，需14位数字'; output.classList.add('output-error'); return; }
        var y = parseInt(text.substr(0, 4), 10);
        var mo = parseInt(text.substr(4, 2), 10);
        var d = parseInt(text.substr(6, 2), 10);
        var h = parseInt(text.substr(8, 2), 10);
        var mi = parseInt(text.substr(10, 2), 10);
        var s = parseInt(text.substr(12, 2), 10);
        var ts = wallToTimestamp(currentOffset(), y, mo, d, h, mi, s);
        if (isNaN(ts)) { output.value = '无效日期'; output.classList.add('output-error'); return; }
        output.classList.remove('output-error');
        output.value = Math.floor(ts / 1000) + '  /  ' + ts + '  (s / ms)';
      }
      document.getElementById('btnQuick').addEventListener('click', toStampQuick);
      document.getElementById('quickInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') toStampQuick(); });

      // —— 时区切换时重算 ——
      tzSelect.addEventListener('change', function () {
        var dateOut = document.getElementById('dateOutput');
        var tsInput = document.getElementById('tsInput');
        if (tsInput.value.trim() && dateOut.value && !dateOut.classList.contains('output-error')) toDate();
      });

      // —— 默认填充当前时间 ——
      (function fillCurrentTime() {
        var now = Date.now();
        var offset = currentOffset();
        var d = new Date(now + offset * 3600000);
        var y = d.getUTCFullYear();
        var mo = d.getUTCMonth() + 1;
        var da = d.getUTCDate();
        var h = d.getUTCHours();
        var mi = d.getUTCMinutes();
        var s = d.getUTCSeconds();

        document.getElementById('tsInput').value = String(Math.floor(now / 1000));
        document.getElementById('inY').value = String(y);
        document.getElementById('inMo').value = pad(mo);
        document.getElementById('inD').value = pad(da);
        document.getElementById('inH').value = pad(h);
        document.getElementById('inMi').value = pad(mi);
        document.getElementById('inS').value = pad(s);
        document.getElementById('quickInput').value = '' + y + pad(mo) + pad(da) + pad(h) + pad(mi) + pad(s);
      })();
    })();
  </script>
