      <div class="tool-app" id="app">

        <div class="field">

        </div>

        <div class="field">

              <label class="flag"><input type="checkbox" name="flag" value="m"><span>m</span></label>
              <label class="flag"><input type="checkbox" name="flag" value="s"><span>s</span></label>

        </div>

  <script>
    (function () {
      var patternInput = document.getElementById('pattern');
      var textInput = document.getElementById('text');
      var errorLine = document.getElementById('errorLine');
      var infoEl = document.getElementById('info');
      var matchList = document.getElementById('matchList');
      var preview = document.getElementById('preview');
      var emptyHint = document.getElementById('emptyHint');
      var flagChecks = document.querySelectorAll('input[name="flag"]');

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function getFlags() {
        var f = '';
        flagChecks.forEach(function (c) { if (c.checked) f += c.value; });
        return f;
      }

      function compute() {
        var pattern = patternInput.value;
        var text = textInput.value;
        var flags = getFlags();

        if (!pattern) {
          errorLine.classList.remove('show');
          errorLine.textContent = '';
          infoEl.textContent = '';
          matchList.innerHTML = '';
          preview.textContent = text || '';
          emptyHint.style.display = 'block';
          return;
        }

        var re;
        try {
          re = new RegExp(pattern, flags.indexOf('g') >= 0 ? flags : flags + 'g');
        } catch (e) {
          errorLine.classList.add('show');
          errorLine.textContent = '正则表达式无效: ' + e.message;
          infoEl.textContent = '';
          matchList.innerHTML = '';
          preview.textContent = text;
          emptyHint.style.display = 'none';
          return;
        }
        errorLine.classList.remove('show');

        var matches = [];
        var its = text.matchAll(re);
        for (var m = its.next(); !m.done; m = its.next()) {
          matches.push(m.value);
        }

        if (matches.length === 0) {
          infoEl.textContent = '无匹配结果';
          matchList.innerHTML = '';
          preview.textContent = text;
          emptyHint.style.display = 'block';
          return;
        }
        emptyHint.style.display = 'none';

        infoEl.textContent = '共 ' + matches.length + ' 个匹配';

        matchList.innerHTML = '';
        matches.forEach(function (mm, idx) {
          var row = document.createElement('div');
          row.className = 'match-row';
          var head = document.createElement('div');
          head.className = 'match-index';
          head.textContent = '#' + (idx + 1) + ' · idx ' + mm.index;
          row.appendChild(head);
          var full = document.createElement('div');
          full.className = 'match-full';
          full.textContent = mm[0];
          row.appendChild(full);
          if (mm.length > 1) {
            var groups = document.createElement('div');
            groups.className = 'match-groups';
            for (var i = 1; i < mm.length; i++) {
              var g = document.createElement('span');
              g.className = 'match-group';
              g.textContent = '[' + i + '] ' + (mm[i] === undefined ? '' : mm[i]);
              groups.appendChild(g);
            }
            row.appendChild(groups);
          }
          matchList.appendChild(row);
        });

        var html = '';
        var last = 0;
        matches.forEach(function (mm) {
          html += escapeHtml(text.slice(last, mm.index)) + '<mark>' + escapeHtml(mm[0]) + '</mark>';
          last = mm.index + mm[0].length;
        });
        html += escapeHtml(text.slice(last));
        preview.innerHTML = html;
      }

      var timer = null;
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(compute, 120);
      }
      patternInput.addEventListener('input', schedule);
      textInput.addEventListener('input', schedule);
      flagChecks.forEach(function (c) { c.addEventListener('change', compute); });

      document.getElementById('btnSample').addEventListener('click', function () {
        patternInput.value = '\\b\\w+@\\w+\\.\\w+';
        textInput.value = 'Contact us: alice@example.com, bob@test.org\nVisit https://example.com for more details.';
        compute();
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        patternInput.value = '';
        textInput.value = '';
        errorLine.classList.remove('show');
        errorLine.textContent = '';
        infoEl.textContent = '';
        matchList.innerHTML = '';
        preview.textContent = '';
        emptyHint.style.display = 'none';
        patternInput.focus();
      });
    })();
  </script>
