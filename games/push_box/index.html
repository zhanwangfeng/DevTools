*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
:root{
  --cell-size:40px;
  --res-dir:res;
  --img-man:var(--img-man);
  --img-box:var(--img-box);
  --img-box-ok:var(--img-box-ok);
  --img-ground:var(--img-ground);
  --img-wall:var(--img-wall);
  --img-target:var(--img-target);
}
body{
  background:#000;
  color:#fff;
  min-height:100vh;
  overflow-x:auto;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
/* ========== push_box 游戏专用样式（Tetris 风格） ========== */
.push-box-game{
  width:100%;
  max-width:520px;
}
.push-box-game .clearfix:after{
  content:"";
  display:table;
  clear:both;
}
/* 游戏容器 - 玻璃态暗色风格 */
.push-box-game .mine-wrap{
  background:rgba(0,0,0,0.25);
  display:inline-block;
  max-width:100%;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:20px;
}

/* 返回按钮（fixed 左上角） */
.push-box-game .nav-back{
  position:fixed;
  top:0;
  left:0;
  z-index:100;
  padding:12px 16px;
  display:flex;
  gap:8px;
}
.push-box-game .nav-back-link{
  color:#7cf;
  text-decoration:none;
  font-size:13px;
  opacity:0.75;
  transition:opacity 0.2s, background 0.2s, transform 0.2s;
  padding:7px 14px;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:8px;
  backdrop-filter:blur(4px);
  white-space:nowrap;
}
.push-box-game .nav-back-link:hover{
  opacity:1;
  background:rgba(16,32,64,0.6);
  transform:translateY(-1px);
}
/* 游戏区域 */
.push-box-game .mine-con{
  background:rgba(0,0,0,0.3);
  padding:12px;
  border-radius:10px;
  border:none;
  max-width:100%;
  text-align:center;
}
/* 信息面板（状态栏） */
.push-box-game .game-tags{
  background:rgba(0,0,0,0.2);
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.06);
  padding:6px 8px;
  text-align:center;
  position:relative;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  max-width:100%;
}
.push-box-game .game-tag-left{
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:60px;
}
.push-box-game .game-tag-right{
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:60px;
}
.push-box-game .panel-label{
  color:#b8d8ff;
  font-size:11px;
  text-align:center;
  opacity:0.8;
  letter-spacing:1px;
  text-transform:uppercase;
}
.push-box-game .stat-value{
  color:#7cf;
  font-size:22px;
  font-weight:bold;
  font-family:"Courier New", "Consolas", monospace;
  letter-spacing:3px;
  text-shadow:0 0 12px rgba(100,200,255,0.3), 0 0 4px rgba(100,200,255,0.15);
}
/* 状态栏中心按钮区 */
.push-box-game .game-tag-center{
  display:flex;
  order:3;
  width:100%;
  gap:6px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0 0;
  border-top:1px solid rgba(255,255,255,0.08);
}
.push-box-game .game-tag-btn{
  padding:5px 12px;
  background:rgba(34,40,54,0.6);
  color:#c8d8f0;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
  transition:all 0.2s;
  user-select:none;
  white-space:nowrap;
}
.push-box-game .game-tag-btn:hover{
  background:rgba(44,52,70,0.8);
  border-color:rgba(100,200,255,0.3);
  color:#fff;
  box-shadow:0 0 10px rgba(100,200,255,0.1);
}
.push-box-game .game-tag-btn:active{

}
.push-box-game .game-tag-btn.mode-btn{
  color:#7cf;
  border-color:rgba(124,204,255,0.4);
}
/* 音效按钮（带图标） */
.push-box-game .game-tag-btn.sound-btn{
  font-size:15px;
  padding:5px 10px;
  line-height:1;
}
/* 按钮禁用状态 */
.push-box-game .game-tag-btn.disabled{
  opacity:0.35;
  cursor:not-allowed;
  pointer-events:none;
}
.push-box-game .game-tag-level{
  color:#7cf;
  font-size:22px;
  font-weight:bold;
  padding:0 8px;
  min-width:36px;
  text-align:center;
  font-family:"Courier New", monospace;
  text-shadow:0 0 12px rgba(100,200,255,0.3);
}
/* 游戏标题 */
.push-box-game .game-title{
  text-align:center;
  margin-top:16px;
  margin-bottom:12px;
}
.push-box-game .game-title .title-main{
  display:block;
  font-size:20px;
  font-weight:bold;
  color:#e8f0ff;
  letter-spacing:2px;
}
/* 状态栏关卡标签 */
.push-box-game .game-tag-level-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}
.push-box-game .game-tag-level-wrap .panel-label{
  margin-bottom:0;
}
/* 游戏画布 */
.push-box-game .mine-canvas{
  border:2px solid rgba(255,255,255,0.08);
  border-radius:0;
  display:inline-block;
  position:relative;
}
/* 动态角色层：用 transform 过渡实现格子间的平滑移动 */
.push-box-game .sprite-layer{
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
  z-index:5;
}
.push-box-game .sprite{
  position:absolute;
  left:0;
  top:0;
  width:var(--cell-size);
  height:var(--cell-size);
  background-size:var(--cell-size) var(--cell-size);
  background-repeat:no-repeat;
  will-change:transform;
  transition:transform 120ms ease-in-out;
}
.push-box-game .sprite.no-anim{
  transition:none;
}
.push-box-game .sprite-man{
  background-image:var(--img-man);
  z-index:6;
}
.push-box-game .sprite-box{
  background-image:var(--img-box);
}
.push-box-game .sprite-box-ok{
  background-image:var(--img-box-ok);
}
/* 推箱子状态：箱子上的方向箭头 */
.push-box-game .sprite.pushing::after{
  content:"➤";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--cell-size) * 0.6);
  line-height:1;
  color:#fff;
  text-shadow:0 0 3px #000, 0 0 6px #000;
  pointer-events:none;
}
.push-box-game .sprite.push-dir-right::after{ transform:rotate(0deg); }
.push-box-game .sprite.push-dir-down::after{ transform:rotate(90deg); }
.push-box-game .sprite.push-dir-left::after{ transform:rotate(180deg); }
.push-box-game .sprite.push-dir-up::after{ transform:rotate(-90deg); }
.push-box-game .mine-con{
  position:relative;
}
.push-box-game .mine-canvas-wrap{
  position:relative;
  display:inline-block;
  max-width:100%;
}
/* 胜利遮罩 */
.push-box-game .win-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:20;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:0;
}
.push-box-game .win-overlay.show{
  display:flex;
}
.push-box-game .win-overlay .win-title{
  font-size:28px;
  color:#7cf;
  font-weight:bold;
  text-shadow:0 0 20px rgba(100,200,255,0.5);
  margin-bottom:8px;
}
.push-box-game .win-overlay .win-hint{
  font-size:14px;
  color:#b8d8ff;
  opacity:0.7;
}
/* 地图区域为空提示层：覆盖地图，点击可切换到下一个模式 */
.push-box-game .custom-empty-mask{
  position:absolute;inset:0;background:rgba(0,0,0,0.82);z-index:25;
  display:none;align-items:center;justify-content:center;padding:16px;
  cursor:pointer;user-select:none;
}
.push-box-game .custom-empty-mask.show{ display:flex; }
.push-box-game .custom-empty-panel{
  max-width:340px;width:100%;text-align:center;pointer-events:none;
}
.push-box-game .custom-empty-panel .ce-title{font-size:18px;color:#7cf;margin-bottom:10px;font-weight:bold;}
.push-box-game .custom-empty-panel .ce-hint{font-size:13px;color:#9ab;line-height:1.7;margin-bottom:14px;}
.push-box-game .custom-empty-panel .ce-next{font-size:12px;color:#7cf8c0;opacity:.85;}
/* 格子样式 */
.push-box-game .mine-canvas > div{
  display:flex;
}
.push-box-game .cell{
  width:var(--cell-size);
  height:var(--cell-size);
  flex-shrink:0;
  display:block;
  position:relative;
  text-align:center;
  line-height:var(--cell-size);
  cursor:pointer;
  border-radius:0;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
/* 推箱子状态下可落点格子的绿色遮罩 */
.push-box-game .cell.push-target::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:none;
  background:rgba(0,255,120,0.35);
  box-shadow:inset 0 0 0 2px rgba(0,255,120,0.75);
}
/* 远处箱子选中后，可达侧显示半透明小人预览 */
.push-box-game .remote-ghost{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  opacity:0.25;
  background-image:var(--img-man);
  background-size:var(--cell-size) var(--cell-size);
  background-repeat:no-repeat;
}
/* 点击格子中心的受击特效：置于所有图层之上 */
.hit-effect{
  position:fixed;
  left:0;
  top:0;
  width:0;
  height:0;
  z-index:9999;
  pointer-events:none;
}
.hit-flash{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--cell-size);
  height:var(--cell-size);
  background:#fff;
  transform:translate(-50%,-50%) scale(0.6);
  animation:hitFlash 180ms ease-out forwards;
}
.hit-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--cell-size);
  height:var(--cell-size);
  border:2px solid #fff;
  box-shadow:0 0 12px rgba(255,255,255,0.95), inset 0 0 10px rgba(255,255,255,0.6);
  transform:translate(-50%,-50%) scale(0.2);
  animation:hitRing 380ms cubic-bezier(.2,.7,.3,1) forwards;
}
.hit-particle{
  position:absolute;
  left:-3px;
  top:-3px;
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 8px #fff;
  animation:hitParticle 420ms ease-out forwards;
}
@keyframes hitFlash{
  0%{ opacity:0.9; transform:translate(-50%,-50%) scale(0.6); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(1.4); }
}
@keyframes hitRing{
  0%{ opacity:1; transform:translate(-50%,-50%) scale(0.2); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(2.2); }
}
@keyframes hitParticle{
  0%{ opacity:1; transform:translate(0,0) scale(1); }
  100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.2); }
}
.push-box-game .cell_box{
  background:var(--img-box);
  background-size:var(--cell-size) var(--cell-size);
  box-shadow:0 0 8px rgba(255,200,0,0.4);
}
.push-box-game .cell_box_tar{
  background:var(--img-box-ok);
  background-size:var(--cell-size) var(--cell-size);
  box-shadow:0 0 8px rgba(0,255,100,0.5);
}
.push-box-game .cell_ground{
  background:var(--img-ground);
  background-size:var(--cell-size) var(--cell-size);
}
.push-box-game .cell_wall{
  background:var(--img-wall);
  background-size:var(--cell-size) var(--cell-size);
  box-shadow:0 0 6px rgba(255,255,255,0.08);
}
.push-box-game .cell_man{
  background:var(--img-man);
  background-size:var(--cell-size) var(--cell-size);
  box-shadow:0 0 10px rgba(100,200,255,0.5);
}
.push-box-game .cell_target{
  background:var(--img-target);
  background-size:var(--cell-size) var(--cell-size);
  box-shadow:0 0 8px rgba(255,100,100,0.3);
}
.push-box-game .mr5{
  margin-right:5px;
}
/* 窄屏适配：压缩外框与状态栏，避免横向溢出 */
@media (max-width: 560px){
  .push-box-game .mine-wrap{ padding:10px; }
  .push-box-game .mine-con{ padding:8px; }
  .push-box-game .game-tag-btn{ padding:4px 8px; font-size:11px; }
  .push-box-game .stat-value,
  .push-box-game .game-tag-level{ font-size:18px; }
  .push-box-game .game-title{ margin-top:10px; margin-bottom:8px; }
  .push-box-game .title-main{ font-size:17px; }
  .push-box-game .nav-back{ padding:8px 10px; }
  .push-box-game .nav-back-link{ padding:6px 10px; font-size:12px; }
  .push-box-game .win-overlay .win-title{ font-size:20px; }
  .push-box-game .win-overlay .win-hint{ font-size:12px; }
}
@media (max-width: 360px){
  .push-box-game .game-tag-center{ gap:4px; }
  .push-box-game .game-tag-btn{ padding:3px 6px; font-size:10px; }
  .push-box-game .mine-wrap{ padding:8px; }
  .push-box-game .mine-con{ padding:6px; }
}
</style>

  <script>
//# 1:wall  @ 2:man  $ 3:box  . 4:target  (space) 5:ground  ! 6:man_tar  * 7:box_tar
(function(){
  'use strict';

  // ========== 音效系统（Web Audio 振荡器合成） ==========
  const Sound = (function(){
    var ctx = null;
    var LS = 'push_box.sfxOn';
    var sfxOn = localStorage.getItem(LS) !== 'false';
    function ensure(){
      if(!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) ctx = new AC();
      }
      if(ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, type, vol, when){
      var c = ensure();
      if(!c || !sfxOn) return;
      var t0 = c.currentTime + (when || 0);
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }
    function sweep(f1, f2, dur, type, vol){
      var c = ensure();
      if(!c || !sfxOn) return;
      var t0 = c.currentTime;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || 'sawtooth';
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      gain.gain.setValueAtTime(vol || 0.14, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }
    return {
      unlock: ensure,
      setSfx: function(on){
        sfxOn = !!on;
        localStorage.setItem(LS, sfxOn ? 'true' : 'false');
        return sfxOn;
      },
      isSfxOn: function(){ return sfxOn; },
      move: function(){ tone(200, 0.06, 'triangle', 0.08); },
      push: function(){ tone(280, 0.08, 'square', 0.10); },
      win: function(){
        [523, 659, 784, 1047].forEach(function(f,i){ tone(f, 0.18, 'square', 0.12, i*0.12); });
      },
      click: function(){ tone(400, 0.04, 'square', 0.06); }
    };
  })();

  const game = {
    cellSize: 40,
    line: 0,
    column: 0,
    cells: [],
    cellEls: [],
    spriteLayer: null,
    manSprite: null,
    boxSprites: {},
    animating: false,
    moveDuration: 120,
    pushMode: null,
    gameOver: false,
    win: false,
    disabled: false,
    runTime: 0,
    leftBox: 0,
    curLevel: 1,
    maxLevel: 90,
    mode: 'standard',          // standard 标准 / custom 我的 / player 玩家上传
    skins: [
      {name:'原始', dir:'res'},
      {name:'立体', dir:'res_dimension'},
      {name:'太空', dir:'res_space'},
      {name:'像素', dir:'res_retro'},
      {name:'水墨', dir:'res_ink'},
      {name:'冰雪', dir:'res_ice'}
    ],
    skinIndex: 0,
    customLevels: [],
    playerLevels: [],
    levelCache: {},
    timerId: null,
    downloading: false,
    undoStack: [],
    winTimer: null,

    // DOM refs
    canvas: document.getElementById('mineCanvas'),
    winOverlay: document.getElementById('winOverlay'),
    boxLeftVal: document.getElementById('boxLeftVal'),
    timeVal: document.getElementById('timeVal'),
    levelLabel: document.getElementById('levelLabel'),

    async init(){
      this.bindEvents();
      this.applySkin(this.skinIndex);
      this.loadCustomLevels();
      this.updateModeBtn();
      this.updateUndoBtn();
      await this.loadLevel(1);
    },

    applySkin(idx){
      this.skinIndex=(idx+this.skins.length)%this.skins.length;
      var skin=this.skins[this.skinIndex];
      var root=document.documentElement;
      root.style.setProperty('--img-man','url('+skin.dir+'/push_box_man.png)');
      root.style.setProperty('--img-box','url('+skin.dir+'/push_box_box.png)');
      root.style.setProperty('--img-box-ok','url('+skin.dir+'/push_box_box_ok.png)');
      root.style.setProperty('--img-ground','url('+skin.dir+'/push_box_ground.png)');
      root.style.setProperty('--img-wall','url('+skin.dir+'/push_box_wall.png)');
      root.style.setProperty('--img-target','url('+skin.dir+'/push_box_target.png)');
      document.getElementById('btnSkin').textContent='素材:'+skin.name;
    },

    switchSkin(){
      this.applySkin(this.skinIndex+1);
    },

    bindEvents(){
      document.addEventListener('keydown', (e) => this.onKeyDown(e));
      // 点击/触摸地图：空地移动小人，相邻箱子推动
      this.canvas.addEventListener('click', (e) => {
        var el = e.target.closest('.cell');
        if(!el || !this.canvas.contains(el)) return;
        var cell = this.getCell(parseInt(el.dataset.l, 10), parseInt(el.dataset.c, 10));
        if(cell) this.cellClick(cell);
      });
      window.addEventListener('resize', () => this.fitCanvasToViewport());
      window.addEventListener('orientationchange', () => this.fitCanvasToViewport());
      document.getElementById('btnMode').onclick = () => {
        if(this.disabled) return;
        Sound.click();
        this.switchToNextMode();
      };
      document.getElementById('btnMakeLevel').onclick = () => {
        Sound.click();
        window.location.href = 'editor_forward.html';
      };
      document.getElementById('customEmptyMask').onclick = () => {
        Sound.click();
        this.switchToNextMode();
      };
      document.getElementById('btnSkin').onclick = () => {
        Sound.click();
        this.switchSkin();
      };
      document.getElementById('btnPrev').onclick = () => {
        if(this.disabled) return;
        Sound.click();
        this.goLevel(-1);
      };
      document.getElementById('btnNext').onclick = () => {
        if(this.disabled) return;
        Sound.click();
        this.goLevel(1);
      };
      document.getElementById('btnReset').onclick = () => {
        if(this.disabled) return;
        Sound.click();
        this.reset();
      };
      document.getElementById('btnUndo').onclick = () => {
        if(this.disabled) return;
        Sound.click();
        this.undo();
      };
      document.getElementById('btnSfx').onclick = function(){
        var on = Sound.setSfx(!Sound.isSfxOn());
        this.textContent = on ? '🔊' : '🔇';
      };
    },

    setDisabled(val){
      this.disabled = val;
      var btns = document.querySelectorAll('.game-tag-btn');
      btns.forEach(function(btn){
        if(val) btn.classList.add('disabled');
        else btn.classList.remove('disabled');
      });
      // 退出禁用模式时，撤销按钮按栈状态恢复
      if(!val) this.updateUndoBtn();
    },

    updateUndoBtn(){
      var btn = document.getElementById('btnUndo');
      if(this.undoStack.length === 0) btn.classList.add('disabled');
      else btn.classList.remove('disabled');
    },

    // 屏幕过窄时按宽度等比缩小格子，屏幕足够宽时保持 40px 不放大
    fitCanvasToViewport(){
      var BASE = 40;
      var root = document.documentElement;
      var wrap = document.getElementById('mineWrap');
      var con = this.canvas.closest('.mine-con');
      if(!wrap || !con) return;
      // 先恢复基准尺寸，保证每次计算都基于 40px 的原始地图宽度
      root.style.setProperty('--cell-size', BASE + 'px');
      function px(v){ return parseFloat(v) || 0; }
      var ws = getComputedStyle(wrap);
      var cs = getComputedStyle(con);
      var ms = getComputedStyle(this.canvas);
      var chrome = px(ws.paddingLeft) + px(ws.paddingRight)
                 + px(ws.borderLeftWidth) + px(ws.borderRightWidth)
                 + px(cs.paddingLeft) + px(cs.paddingRight)
                 + px(ms.borderLeftWidth) + px(ms.borderRightWidth);
      var host = wrap.parentElement;
      var hostWidth = host ? host.clientWidth : root.clientWidth;
      var limit = Math.min(root.clientWidth, hostWidth || root.clientWidth);
      var available = limit - chrome - 8;
      var natural = this.column * BASE;
      var size = BASE;
      if(natural > available && available > 0){
        size = Math.max(10, Math.floor(BASE * available / natural));
      }
      root.style.setProperty('--cell-size', size + 'px');
    },

    onKeyDown(e){
      if(this.gameOver || this.disabled) return;
      const man = this.findManCell();
      if(!man) return;
      let target = null;
      switch(e.key){
        case 'ArrowUp':    target = this.getCell(man.idxL-1, man.idxC); break;
        case 'ArrowDown':  target = this.getCell(man.idxL+1, man.idxC); break;
        case 'ArrowLeft':  target = this.getCell(man.idxL, man.idxC-1); break;
        case 'ArrowRight': target = this.getCell(man.idxL, man.idxC+1); break;
        default: return;
      }
      e.preventDefault();
      if(this.pushMode) this.exitPushMode();
      if(target) this.directStep(target);
    },

    loadCustomLevels(){
      try{
        var list = JSON.parse(localStorage.getItem('pb_editor_official_v1') || '[]');
        this.customLevels = Array.isArray(list) ? list.slice().sort(function(a,b){
          var ta = a.createdAt || 0, tb = b.createdAt || 0;
          if(ta !== tb) return ta - tb;
          return (a.fileNo || 0) - (b.fileNo || 0);
        }) : [];
      }catch(e){
        this.customLevels = [];
      }
    },

    updateModeBtn(){
      var label = this.mode === 'standard' ? '标准' : (this.mode === 'custom' ? '我的' : '玩家上传');
      document.getElementById('btnMode').textContent = label;
      document.getElementById('btnMakeLevel').style.display = this.mode === 'custom' ? 'inline-block' : 'none';
    },

    async setMode(mode){
      if(mode === this.mode) return;
      if(mode === 'custom'){
        this.loadCustomLevels();
        if(!this.customLevels.length){
          this.mode = mode;
          this.maxLevel = 0;
          this.updateModeBtn();
          this.showCustomEmpty('暂无我的关卡', '请先用关卡编辑器创建并保存一个关卡，之后即可在此切换游玩。');
          return;
        }
      }
      if(mode === 'player'){
        var ok = await this.loadPlayerLevels();
        if(!ok){
          this.mode = mode;
          this.maxLevel = 0;
          this.updateModeBtn();
          return;
        }
      }
      document.getElementById('customEmptyMask').classList.remove('show');
      this.mode = mode;
      this.maxLevel = mode === 'standard' ? 90
        : (mode === 'custom' ? this.customLevels.length : this.playerLevels.length);
      this.curLevel = 1;
      this.updateModeBtn();
      await this.loadLevel(1);
    },

    showCustomEmpty(title, hint){
      document.querySelector('#customEmptyMask .ce-title').textContent = title;
      document.querySelector('#customEmptyMask .ce-hint').textContent = hint;
      document.getElementById('customEmptyMask').classList.add('show');
    },

    switchToNextMode(){
      var order = ['standard', 'custom', 'player'];
      var next = order[(order.indexOf(this.mode) + 1) % order.length];
      this.setMode(next);
    },

    async loadPlayerLevels(){
      this.playerLevels = [];
      try{
        var resp = await fetch('push_box_use_levels/list.json');
        if(!resp.ok) throw new Error('list.json ' + resp.status);
        var list = await resp.json();
        this.playerLevels = (list && Array.isArray(list.levels)) ? list.levels : [];
      }catch(e){
        console.error('加载玩家关卡列表失败:', e);
      }
      if(!this.playerLevels.length){
        this.showCustomEmpty('暂无玩家关卡', '玩家上传的关卡为空，请稍后再试。');
        return false;
      }
      return true;
    },

    async goLevel(step){
      if(!this.maxLevel) return;
      var n = this.curLevel + step;
      if(n < 1) n = this.maxLevel;
      if(n > this.maxLevel) n = 1;
      if(n === this.curLevel) return;
      await this.loadLevel(n);
    },

    async loadLevel(num){
      // 清理状态
      if(this.winTimer){
        clearTimeout(this.winTimer);
        this.winTimer = null;
      }
      this.winOverlay.classList.remove('show');
      this.exitPushMode();
      this.undoStack = [];
      this.setDisabled(false);
      this.updateUndoBtn();

      this.curLevel = num;
      this.levelLabel.textContent = num;

      var cacheKey = this.mode + ':' + num;
      if(!this.levelCache[cacheKey]){
        if(this.mode === 'custom'){
          var rec = this.customLevels[num - 1];
          var parsed = this.parseCustom(rec);
          if(!parsed){
            console.error('自定义关卡数据无效:', num, rec);
            return;
          }
          this.levelCache[cacheKey] = parsed;
        } else {
          var file = this.mode === 'player'
            ? 'push_box_use_levels/levels/' + (this.playerLevels[num - 1].file || ('screen.' + num))
            : 'levels/screen.' + num;
          this.downloading = true;
          try {
            var resp = await fetch(file);
            if(!resp.ok) throw new Error('HTTP ' + resp.status);
            var text = await resp.text();
            this.levelCache[cacheKey] = this.parseLevel(text);
          } catch(e){
            console.error('加载关卡失败:', num, e);
            this.downloading = false;
            return;
          }
          this.downloading = false;
        }
      }

      var ld = this.levelCache[cacheKey];
      this.line = ld.h;
      this.column = ld.w;
      this.runTime = 0;
      this.gameOver = false;
      this.win = false;

      // 重建 cells
      this.cells = [];
      for(var i=0; i<this.line; i++){
        var row = [];
        for(var j=0; j<this.column; j++){
          row.push({
            idxL: i,
            idxC: j,
            type: ld.d[i][j],
            canMove: false,
          });
        }
        this.cells.push(row);
      }

      this.renderGrid();
      this.fitCanvasToViewport();
      this.refreshAllMovable();
      this.checkWin();
      this.updateStatus();
      this.clearTimer();
    },

    charCode(c){
      if(c === '#') return 1;
      if(c === '@') return 2;
      if(c === '$') return 3;
      if(c === '.') return 4;
      if(c === '!') return 6;
      if(c === '*') return 7;
      return 5;
    },

    parseLevel(text){
      var strings = text.split('\n');
      var numbers = [];
      var maxW = 0;
      for(var i=0; i<strings.length; i++){
        var s = strings[i];
        if(s.trim() === '') continue;
        var line = [];
        for(var j=0; j<s.length; j++) line.push(this.charCode(s.charAt(j)));
        numbers.push(line);
        if(line.length > maxW) maxW = line.length;
      }
      for(var i=0; i<numbers.length; i++){
        while(numbers[i].length < maxW) numbers[i].push(5);
      }
      return { d: numbers, h: numbers.length, w: maxW };
    },

    parseCustom(rec){
      if(!rec || !Array.isArray(rec.grid)) return null;
      var rows = rec.grid.length;
      var maxW = 0;
      var numbers = [];
      for(var i=0; i<rows; i++){
        var row = Array.isArray(rec.grid[i]) ? rec.grid[i] : [];
        var line = [];
        for(var j=0; j<row.length; j++) line.push(this.charCode(row[j]));
        numbers.push(line);
        if(line.length > maxW) maxW = line.length;
      }
      for(var i=0; i<numbers.length; i++){
        while(numbers[i].length < maxW) numbers[i].push(5);
      }
      return { d: numbers, h: numbers.length, w: maxW };
    },

    renderGrid(){
      this.canvas.innerHTML = '';
      this.cellEls = [];
      for(var i=0; i<this.line; i++){
        var rowDiv = document.createElement('div');
        var rowEls = [];
        for(var j=0; j<this.column; j++){
          var cell = this.cells[i][j];
          var div = document.createElement('div');
          div.className = this.getCellClass(cell);
          div.dataset.l = i;
          div.dataset.c = j;
          rowDiv.appendChild(div);
          rowEls.push(div);
        }
        this.canvas.appendChild(rowDiv);
        this.cellEls.push(rowEls);
      }
      this.spriteLayer = document.createElement('div');
      this.spriteLayer.className = 'sprite-layer';
      this.canvas.appendChild(this.spriteLayer);
      this.manSprite = document.createElement('div');
      this.manSprite.className = 'sprite sprite-man';
      this.spriteLayer.appendChild(this.manSprite);
      this.boxSprites = {};
      this.syncSprites(true);
    },

    // 格子只渲染静态地面/墙/目标，角色由 sprite 层独立渲染
    getCellClass(cell){
      if(cell.type === 1) return 'cell cell_wall';
      if(cell.type === 4 || cell.type === 6 || cell.type === 7) return 'cell cell_target';
      return 'cell cell_ground';
    },

    updateCellClass(cell){
      if(this.cellEls[cell.idxL] && this.cellEls[cell.idxL][cell.idxC]){
        this.cellEls[cell.idxL][cell.idxC].className = this.getCellClass(cell);
      }
    },

    cellKey(l, c){
      return l + ',' + c;
    },

    setSpritePos(el, l, c, noAnim){
      if(!el) return;
      if(noAnim) el.classList.add('no-anim');
      el.style.transform = 'translate(calc(var(--cell-size) * ' + c + '), calc(var(--cell-size) * ' + l + '))';
      if(noAnim){
        void el.offsetWidth;
        el.classList.remove('no-anim');
      }
    },

    syncSprites(noAnim){
      if(!this.spriteLayer) return;
      var man = this.findManCell();
      if(man) this.setSpritePos(this.manSprite, man.idxL, man.idxC, noAnim);
      var self = this;
      Object.keys(this.boxSprites).forEach(function(k){
        var el = self.boxSprites[k];
        if(el.parentNode) el.parentNode.removeChild(el);
      });
      this.boxSprites = {};
      for(var l=0; l<this.line; l++){
        for(var c=0; c<this.column; c++){
          var t = this.cells[l][c].type;
          if(t === 3 || t === 7){
            var el = document.createElement('div');
            el.className = 'sprite ' + (t === 7 ? 'sprite-box-ok' : 'sprite-box');
            this.spriteLayer.appendChild(el);
            this.setSpritePos(el, l, c, noAnim);
            this.boxSprites[this.cellKey(l, c)] = el;
          }
        }
      }
    },

    wait(ms){
      return new Promise(function(resolve){ setTimeout(resolve, ms); });
    },

    transformFor(l, c){
      return 'translate(calc(var(--cell-size) * ' + c + '), calc(var(--cell-size) * ' + l + '))';
    },

    async animateWalk(path){
      if(!path || !path.length) return;
      this.animating = true;
      var el = this.manSprite;
      var man = this.findManCell();
      var frames = [];
      if(man) frames.push({ transform: this.transformFor(man.idxL, man.idxC) });
      for(var i=0; i<path.length; i++){
        frames.push({ transform: this.transformFor(path[i].idxL, path[i].idxC) });
      }
      var last = path[path.length-1];
      if(frames.length < 2) frames.push({ transform: this.transformFor(last.idxL, last.idxC) });
      var anim = el.animate(frames, {
        duration: this.moveDuration * path.length,
        easing: 'linear',
        fill: 'forwards'
      });
      try { await anim.finished; } catch(e){}
      el.style.transform = this.transformFor(last.idxL, last.idxC);
      anim.cancel();
      this.animating = false;
    },

    async animatePush(manCell, boxCell, pushTo){
      this.animating = true;
      var boxEl = this.boxSprites[this.cellKey(boxCell.idxL, boxCell.idxC)];
      this.setSpritePos(this.manSprite, boxCell.idxL, boxCell.idxC);
      if(boxEl){
        boxEl.className = 'sprite ' + (pushTo.type === 4 ? 'sprite-box-ok' : 'sprite-box');
        this.setSpritePos(boxEl, pushTo.idxL, pushTo.idxC);
      }
      await this.wait(this.moveDuration);
      this.animating = false;
    },

    findPath(start, target){
      var keyOf = function(c){ return c.idxL + ',' + c.idxC; };
      var queue = [start];
      var prev = {};
      prev[keyOf(start)] = null;
      var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      var qi = 0;
      while(qi < queue.length){
        var cur = queue[qi++];
        if(cur === target) break;
        for(var d=0; d<dirs.length; d++){
          var nb = this.getCell(cur.idxL + dirs[d][0], cur.idxC + dirs[d][1]);
          if(!nb || !this.cellIsEmpty(nb)) continue;
          var k = keyOf(nb);
          if(prev[k] !== undefined) continue;
          prev[k] = cur;
          queue.push(nb);
        }
      }
      var tk = keyOf(target);
      if(prev[tk] === undefined) return null;
      var path = [];
      var cur = target;
      while(cur && cur !== start){
        path.unshift(cur);
        cur = prev[keyOf(cur)];
      }
      return path;
    },

    // ---- 推箱子模式（点击箱子后选择落点） ----
    enterPushMode(man, box){
      var dirL = box.idxL - man.idxL;
      var dirC = box.idxC - man.idxC;
      if((dirL !== 0 && dirC !== 0) || (dirL === 0 && dirC === 0)) return false;
      var targets = [];
      var l = box.idxL + dirL;
      var c = box.idxC + dirC;
      while(true){
        var cell = this.getCell(l, c);
        if(!cell || !this.cellIsEmpty(cell)) break;
        targets.push(cell);
        l += dirL;
        c += dirC;
      }
      if(!targets.length) return false;
      this.exitPushMode();
      var dirName = dirC === 1 ? 'right' : (dirC === -1 ? 'left' : (dirL === 1 ? 'down' : 'up'));
      this.pushMode = {
        dirL: dirL, dirC: dirC,
        boxL: box.idxL, boxC: box.idxC,
        targets: targets
      };
      var self = this;
      targets.forEach(function(t){
        var el = self.cellEls[t.idxL] && self.cellEls[t.idxL][t.idxC];
        if(el) el.classList.add('push-target');
      });
      var boxEl = this.boxSprites[this.cellKey(box.idxL, box.idxC)];
      if(boxEl) boxEl.classList.add('pushing', 'push-dir-' + dirName);
      return true;
    },

    exitPushMode(){
      if(!this.pushMode) return;
      var mode = this.pushMode;
      var self = this;
      mode.targets.forEach(function(t){
        var el = self.cellEls[t.idxL] && self.cellEls[t.idxL][t.idxC];
        if(el) el.classList.remove('push-target');
      });
      var boxEl = this.boxSprites[this.cellKey(mode.boxL, mode.boxC)];
      if(boxEl){
        boxEl.classList.remove('pushing', 'push-dir-right', 'push-dir-down', 'push-dir-left', 'push-dir-up');
      }
      if(mode.candidates){
        mode.candidates.forEach(function(c){
          if(c.ghostEl && c.ghostEl.parentNode) c.ghostEl.parentNode.removeChild(c.ghostEl);
        });
      }
      this.pushMode = null;
    },

    // 点击远处箱子：小人留在原地，标出可达侧与反方向落点
    enterRemotePushMode(box){
      var man = this.findManCell();
      if(!man || !this.cellIsBox(box)) return false;
      var dirs = [[-1,0],[0,-1],[1,0],[0,1]];
      var candidates = [];
      for(var i=0; i<dirs.length; i++){
        var dl = dirs[i][0], dc = dirs[i][1];
        var side = this.getCell(box.idxL + dl, box.idxC + dc);
        if(!side || !(this.cellIsMan(side) || this.manIsLine(man, side))) continue;
        var targets = [];
        var l = box.idxL - dl, c = box.idxC - dc;
        while(true){
          var cell = this.getCell(l, c);
          if(!cell) break;
          // 小人离开后自己的格子也可作为推动落点
          if(!this.cellIsEmpty(cell) && !this.cellIsMan(cell)) break;
          targets.push(cell);
          l -= dl;
          c -= dc;
        }
        if(!targets.length) continue;
        candidates.push({ side:side, targets:targets, dirL:-dl, dirC:-dc });
      }
      if(!candidates.length) return false;
      this.exitPushMode();
      var allTargets = [];
      candidates.forEach(function(c){ allTargets = allTargets.concat(c.targets); });
      this.pushMode = {
        remote:true,
        boxL:box.idxL, boxC:box.idxC,
        candidates:candidates,
        targets:allTargets
      };
      var self = this;
      candidates.forEach(function(c){
        c.targets.forEach(function(t){
          var el = self.cellEls[t.idxL] && self.cellEls[t.idxL][t.idxC];
          if(el) el.classList.add('push-target');
        });
      });
      candidates.forEach(function(c){
        var sideEl = self.cellEls[c.side.idxL] && self.cellEls[c.side.idxL][c.side.idxC];
        if(sideEl && !sideEl.classList.contains('push-target')){
          var ghost = document.createElement('div');
          ghost.className = 'remote-ghost';
          sideEl.appendChild(ghost);
          c.ghostEl = ghost;
        }
      });
      return true;
    },

    async performRemotePush(mode, candidate, target){
      var box = this.getCell(mode.boxL, mode.boxC);
      if(!box) return;
      this.exitPushMode();
      var man = this.findManCell();
      if(!man) return;
      await this.walkTo(man, candidate.side);
      this.pushMode = {
        dirL: candidate.dirL,
        dirC: candidate.dirC,
        boxL: box.idxL,
        boxC: box.idxC,
        targets: candidate.targets
      };
      await this.performPush(target);
    },

    recordPushUndo(man, box, target){
      this.undoStack.push({
        manL: man.idxL, manC: man.idxC, manType: man.type,
        boxL: box.idxL, boxC: box.idxC, boxType: box.type,
        targetL: target.idxL, targetC: target.idxC, targetType: target.type
      });
    },

    commitWalk(man, last){
      if(man.type === 6) man.type = 4;
      else man.type = 5;
      if(last.type === 4) last.type = 6;
      else last.type = 2;
      this.refreshAllMovable();
    },

    async walkTo(man, cell){
      if(!man || !this.manIsLine(man, cell)) return false;
      var path = this.findPath(man, cell);
      if(!path || !path.length) return false;
      Sound.move();
      this.createTimerIfNone();
      await this.animateWalk(path);
      this.commitWalk(man, path[path.length - 1]);
      return true;
    },

    // 点击远处箱子：走到它四周离小人最近的可达格（步数优先，其次上左下右）
    async moveToNearestBoxSide(man, box){
      var dirs = [[-1,0],[0,-1],[1,0],[0,1]];
      var best = null;
      for(var i=0; i<dirs.length; i++){
        var side = this.getCell(box.idxL + dirs[i][0], box.idxC + dirs[i][1]);
        if(!side || !this.manIsLine(man, side)) continue;
        var path = this.findPath(man, side);
        if(!path || !path.length) continue;
        if(!best || path.length < best.steps){
          best = { cell: side, steps: path.length };
        }
      }
      if(!best) return false;
      await this.walkTo(man, best.cell);
      if(!this.gameOver) this.enterPushMode(this.findManCell(), box);
      return true;
    },

    commitPush(man, box, target){
      var dirL = target.idxL - box.idxL;
      var dirC = target.idxC - box.idxC;
      var steps = Math.abs(dirL) + Math.abs(dirC);
      dirL = dirL ? dirL / steps : 0;
      dirC = dirC ? dirC / steps : 0;
      this.cellChangeToEmpty(man);
      for(var i=0; i<steps; i++){
        var passed = this.getCell(box.idxL + dirL * i, box.idxC + dirC * i);
        if(passed) this.cellChangeToEmpty(passed);
      }
      var manFinal = this.getCell(box.idxL + dirL * (steps - 1), box.idxC + dirC * (steps - 1));
      this.cellChangeToMan(manFinal);
      this.cellChangeToBox(target);
      this.refreshAllMovable();
      this.updateUndoBtn();
      this.checkWin();
    },

    async performPush(target){
      if(this.animating) return;
      var mode = this.pushMode;
      var man = this.findManCell();
      var box = mode ? this.getCell(mode.boxL, mode.boxC) : null;
      if(!mode || !man || !box) return;
      var steps = Math.abs(target.idxL - box.idxL) + Math.abs(target.idxC - box.idxC);
      if(steps < 1) return;
      this.exitPushMode();
      this.recordPushUndo(man, box, target);
      Sound.push();
      this.createTimerIfNone();
      this.animating = true;
      var boxEl = this.boxSprites[this.cellKey(box.idxL, box.idxC)];
      if(boxEl){
        boxEl.className = 'sprite ' + (target.type === 4 ? 'sprite-box-ok' : 'sprite-box');
      }
      var manFrames = [{ transform: this.transformFor(man.idxL, man.idxC) }];
      var boxFrames = [{ transform: this.transformFor(box.idxL, box.idxC) }];
      for(var i=1; i<=steps; i++){
        manFrames.push({ transform: this.transformFor(box.idxL + mode.dirL * (i-1), box.idxC + mode.dirC * (i-1)) });
        boxFrames.push({ transform: this.transformFor(box.idxL + mode.dirL * i, box.idxC + mode.dirC * i) });
      }
      var opts = { duration: this.moveDuration * steps, easing: 'linear', fill: 'forwards' };
      var anims = [ this.manSprite.animate(manFrames, opts) ];
      if(boxEl) anims.push(boxEl.animate(boxFrames, opts));
      try { await Promise.all(anims.map(function(a){ return a.finished; })); } catch(e){}
      this.manSprite.style.transform = manFrames[manFrames.length-1].transform;
      if(boxEl){ boxEl.style.transform = boxFrames[boxFrames.length-1].transform; }
      anims.forEach(function(a){ a.cancel(); });
      this.animating = false;
      this.commitPush(man, box, target);
      // 推动完成后重新执行远处箱子逻辑，展示所有可达方向的绿色通道
      if(!this.gameOver) this.enterRemotePushMode(target);
    },

    // 推动指定箱子一格，并以新位置继续保持在推箱子状态
    async pushOneStep(box){
      var man = this.findManCell();
      if(!man || !this.cellIsBox(box)) return false;
      if(Math.abs(box.idxL - man.idxL) + Math.abs(box.idxC - man.idxC) !== 1) return false;
      var pushTo = this.getPushBoxToCell(man, box);
      if(!pushTo) return false;
      this.recordPushUndo(man, box, pushTo);
      Sound.push();
      this.createTimerIfNone();
      await this.animatePush(man, box, pushTo);
      this.commitPush(man, box, pushTo);
      if(!this.gameOver){
        this.enterRemotePushMode(pushTo);
      }
      return true;
    },

    // 键盘单步移动：保持原有即时推箱行为
    async directStep(cell){
      if(!cell || this.gameOver || this.disabled || this.animating) return;
      var man = this.findManCell();
      if(!man) return;
      if(this.manIsLine(man, cell)){
        Sound.move();
        this.createTimerIfNone();
        await this.animateWalk([cell]);
        this.commitWalk(man, cell);
        return;
      }
      var pushTo = this.getPushBoxToCell(man, cell);
      if(pushTo){
        this.recordPushUndo(man, cell, pushTo);
        Sound.push();
        this.createTimerIfNone();
        await this.animatePush(man, cell, pushTo);
        this.commitPush(man, cell, pushTo);
      }
    },

    // ---- 游戏逻辑（保持原样） ----
    getCell(idxL, idxC){
      if(idxL < 0 || idxL >= this.line) return null;
      if(idxC < 0 || idxC >= this.column) return null;
      return this.cells[idxL][idxC];
    },

    findManCell(){
      for(var l=0; l<this.line; l++)
        for(var c=0; c<this.column; c++)
          if(this.cells[l][c].type === 2 || this.cells[l][c].type === 6)
            return this.cells[l][c];
      return null;
    },

    cellIsMan(cell){
      if(!cell) return false;
      return cell.type === 2 || cell.type === 6;
    },

    cellIsBox(cell){
      if(!cell) return false;
      return cell.type === 3 || cell.type === 7;
    },

    cellIsEmpty(cell){
      if(!cell) return false;
      return cell.type === 5 || cell.type === 4;
    },

    cellChangeToBox(cell){
      if(!cell) return;
      if(cell.type === 4) cell.type = 7;
      else if(cell.type === 5) cell.type = 3;
    },

    cellChangeToMan(cell){
      if(!cell) return;
      if(cell.type === 4) cell.type = 6;
      else if(cell.type === 5) cell.type = 2;
    },

    cellChangeToEmpty(cell){
      if(!cell) return;
      if(cell.type === 2 || cell.type === 3) cell.type = 5;
      else if(cell.type === 6 || cell.type === 7) cell.type = 4;
    },

    getPushBoxToCell(manCell, boxCell){
      if(!this.cellIsMan(manCell)) return null;
      if(!this.cellIsBox(boxCell)) return null;
      var dL = boxCell.idxL - manCell.idxL;
      var dC = boxCell.idxC - manCell.idxC;
      if(dL !== 0 && dC !== 0) return null;
      if(dL === 1 || dL === -1){
        var cell = this.getCell(boxCell.idxL + dL, boxCell.idxC);
        if(this.cellIsEmpty(cell)) return cell;
      } else if(dC === 1 || dC === -1){
        var cell = this.getCell(boxCell.idxL, boxCell.idxC + dC);
        if(this.cellIsEmpty(cell)) return cell;
      }
      return null;
    },

    manIsLine(manCell, cellTarget){
      if(!manCell || !cellTarget) return false;
      if(manCell.type !== 2 && manCell.type !== 6) return false;
      if(cellTarget.type !== 5 && cellTarget.type !== 4) return false;
      return cellTarget.canMove;
    },

    refreshCellMovable(cell){
      if(!cell) return;
      if(cell.canMove) return;
      if(this.cellIsMan(cell) || this.cellIsEmpty(cell)){
        cell.canMove = true;
        this.refreshCellMovable(this.getCell(cell.idxL,   cell.idxC+1));
        this.refreshCellMovable(this.getCell(cell.idxL,   cell.idxC-1));
        this.refreshCellMovable(this.getCell(cell.idxL+1, cell.idxC));
        this.refreshCellMovable(this.getCell(cell.idxL-1, cell.idxC));
      }
    },

    refreshAllMovable(){
      for(var i=0; i<this.line; i++)
        for(var j=0; j<this.column; j++)
          this.cells[i][j].canMove = false;
      var man = this.findManCell();
      this.refreshCellMovable(man);
      this.refreshAllCellClass();
    },

    refreshAllCellClass(){
      for(var l=0; l<this.line; l++)
        for(var c=0; c<this.column; c++)
          this.updateCellClass(this.cells[l][c]);
      this.syncSprites();
    },

    playClickEffect(cell){
      var el = this.cellEls[cell.idxL] && this.cellEls[cell.idxL][cell.idxC];
      if(!el) return;
      var rect = el.getBoundingClientRect();
      var fx = document.createElement('div');
      fx.className = 'hit-effect';
      fx.style.left = (rect.left + rect.width / 2) + 'px';
      fx.style.top = (rect.top + rect.height / 2) + 'px';
      fx.appendChild(Object.assign(document.createElement('div'), { className:'hit-flash' }));
      fx.appendChild(Object.assign(document.createElement('div'), { className:'hit-ring' }));
      for(var i=0; i<8; i++){
        var angle = (Math.PI * 2 * i / 8) + (Math.random() * 0.3 - 0.15);
        var dist = 20 + Math.random() * 18;
        var particle = document.createElement('div');
        particle.className = 'hit-particle';
        particle.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
        particle.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
        fx.appendChild(particle);
      }
      document.body.appendChild(fx);
      setTimeout(function(){
        if(fx.parentNode) fx.parentNode.removeChild(fx);
      }, 520);
    },

    async cellClick(cell){
      if(!cell || this.gameOver || this.disabled || this.animating) return;
      this.playClickEffect(cell);

      if(this.pushMode){
        var mode = this.pushMode;
        if(mode.remote){
          var cand = null, remoteTarget = null;
          // 绿色落点优先：同一格可能既是某方向落点，又是另一方向的侧位
          for(var ci=0; ci<mode.candidates.length && !cand; ci++){
            if(mode.candidates[ci].targets.indexOf(cell) >= 0){
              cand = mode.candidates[ci];
              remoteTarget = cell;
            }
          }
          for(var ci=0; ci<mode.candidates.length && !cand; ci++){
            if(mode.candidates[ci].side === cell){
              cand = mode.candidates[ci];
              remoteTarget = cand.targets[0];
            }
          }
          if(cand){
            await this.performRemotePush(mode, cand, remoteTarget);
            return;
          }
          if(cell.idxL === mode.boxL && cell.idxC === mode.boxC) return;
          this.exitPushMode();
          if(!this.cellIsBox(cell)){
            var remoteMan = this.findManCell();
            if(remoteMan) await this.walkTo(remoteMan, cell);
            return;
          }
        } else {
          // 绿色落点：推动到该格并保持推箱子状态
          if(mode.targets.indexOf(cell) >= 0){
            await this.performPush(cell);
            return;
          }
          // 当前状态对应的箱子：再推一格，保持推箱子状态
          if(cell.idxL === mode.boxL && cell.idxC === mode.boxC){
            this.exitPushMode();
            await this.pushOneStep(cell);
            return;
          }
          // 其他箱子：退出当前状态，按普通点击处理（切换到该箱子）
          this.exitPushMode();
          if(!this.cellIsBox(cell)){
            var modeMan = this.findManCell();
            if(modeMan) await this.walkTo(modeMan, cell);
            return;
          }
        }
      }

      var man = this.findManCell();
      if(!man) return;

      // 点击空地 -> 沿最短路径逐格平滑移动
      if(this.manIsLine(man, cell)){
        await this.walkTo(man, cell);
        return;
      }

      // 点击相邻箱子 -> 先推动一格，再进入推箱子状态显示后续落点与方向
      var isAdjacentBox = this.cellIsBox(cell) &&
        (Math.abs(cell.idxL - man.idxL) + Math.abs(cell.idxC - man.idxC)) === 1;
      if(isAdjacentBox){
        await this.pushOneStep(cell);
      } else if(this.cellIsBox(cell)){
        this.enterRemotePushMode(cell);
      }
    },

    checkWin(){
      if(this.gameOver) return;
      var left = 0;
      for(var i=0; i<this.line; i++)
        for(var j=0; j<this.column; j++)
          if(this.cells[i][j].type === 3) left++;
      this.leftBox = left;
      if(left === 0) this.gameOverHandler(true);
      this.updateStatus();
    },

    gameOverHandler(win){
      if(this.gameOver) return;
      this.gameOver = true;
      this.win = win;
      this.clearTimer();
      this.refreshAllCellClass();
      this.updateStatus();
      if(win){
        Sound.win();
        // 显示胜利遮罩
        this.winOverlay.classList.add('show');
        this.setDisabled(true);
        // 3秒后自动下一关
        var self = this;
        this.winTimer = setTimeout(function(){
          self.winOverlay.classList.remove('show');
          self.setDisabled(false);
          self.undoStack = [];
          self.goLevel(1);
        }, 3000);
      }
    },

    reset(){
      this.loadLevel(this.curLevel);
    },

    async undo(){
      if(this.undoStack.length === 0 || this.animating) return;
      this.exitPushMode();
      var step = this.undoStack.pop();
      var curMan = this.findManCell();
      var boxEl = this.boxSprites[this.cellKey(step.targetL, step.targetC)];
      this.animating = true;
      if(curMan) this.setSpritePos(this.manSprite, step.manL, step.manC);
      if(boxEl){
        boxEl.className = 'sprite ' + (step.boxType === 7 ? 'sprite-box-ok' : 'sprite-box');
        this.setSpritePos(boxEl, step.boxL, step.boxC);
      }
      await this.wait(this.moveDuration);
      this.animating = false;

      if(curMan){
        if(curMan.type === 6) curMan.type = 4;
        else curMan.type = 5;
      }
      var man = this.cells[step.manL][step.manC];
      var box = this.cells[step.boxL][step.boxC];
      var target = this.cells[step.targetL][step.targetC];
      man.type = step.manType;
      box.type = step.boxType;
      target.type = step.targetType;
      this.refreshAllMovable();
      this.checkWin();
      this.updateUndoBtn();
    },

    // ---- 计时器 ----
    clearTimer(){
      if(this.timerId){ clearInterval(this.timerId); this.timerId = null; }
    },

    createTimerIfNone(){
      if(this.timerId) return;
      this.timerId = setInterval(() => this.timerTick(), 1000);
    },

    timerTick(){
      if(this.gameOver) return;
      this.runTime++;
      this.updateStatus();
    },

    // ---- 显示更新 ----
    updateStatus(){
      // 剩余箱子数（3位）
      var left = this.leftBox;
      if(left > 999) left = 999;
      var leftStr = left > 99 ? '' + left : (left > 9 ? '0' + left : '00' + left);
      if(left === 0) leftStr = '000';
      this.boxLeftVal.textContent = leftStr;

      // 用时（3位）
      var t = this.runTime;
      if(t > 999) t = 999;
      var tStr = t > 99 ? '' + t : (t > 9 ? '0' + t : '00' + t);
      if(t === 0) tStr = '000';
      this.timeVal.textContent = tStr;
    },
  };

  game.init();

  // 初始化音效按钮状态
  document.getElementById('btnSfx').textContent = Sound.isSfxOn() ? '🔊' : '🔇';

  // 首次用户交互解锁音频
  function unlockAudio(){
    Sound.unlock();
    window.removeEventListener('keydown', unlockAudio);
    window.removeEventListener('click', unlockAudio);
  }
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('click', unlockAudio);

  // 固定位置广告
  try{ (adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
})();
  </script>
