<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>正向推箱子关卡编辑器 - codejson.cn</title>
<style>
:root{--cell-size:32px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{
  min-height:100vh;
  background:#000;
  color:#e8f0ff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 10px 40px;
}
a{color:#7cf;text-decoration:none;}
.game-editor{width:100%;max-width:980px;}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.top-bar h1{font-size:20px;letter-spacing:1px;}
.back-link{padding:6px 12px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(0,0,0,.4);}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:8px 16px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(30,40,60,.4);color:#9ab;cursor:pointer;font-size:13px;}
.tab.active{background:rgba(60,120,180,.35);border-color:rgba(124,204,255,.5);color:#fff;}
.tab.disabled{opacity:.4;cursor:not-allowed;}
.panel{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-bottom:14px;}
.panel-title{font-size:14px;color:#b8d8ff;margin-bottom:12px;letter-spacing:1px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
label{font-size:12px;color:#9ab;display:flex;align-items:center;gap:6px;}
input[type=text],input[type=number]{
  background:rgba(10,16,28,.8);border:1px solid rgba(255,255,255,.15);border-radius:6px;
  color:#fff;padding:6px 9px;font-size:13px;
}
input[type=number]{width:70px;}
.btn{
  padding:7px 14px;border:1px solid rgba(255,255,255,.16);border-radius:7px;
  background:rgba(40,50,70,.65);color:#dce8ff;cursor:pointer;font-size:13px;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:rgba(60,80,110,.8);border-color:rgba(124,204,255,.45);}
.btn:active{transform:scale(.97);}
.btn.primary{background:rgba(40,110,160,.65);border-color:rgba(124,204,255,.5);color:#fff;}
.btn.danger{background:rgba(130,40,50,.5);border-color:rgba(255,120,120,.35);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;gap:8px;flex-wrap:wrap;}
.tool{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;
  border:1px solid rgba(255,255,255,.12);background:rgba(30,40,56,.6);
  color:#cddcf0;cursor:pointer;font-size:12px;
}
.tool.active{border-color:#7cf;background:rgba(60,120,180,.4);color:#fff;}
.swatch{width:22px;height:22px;display:inline-block;background-size:var(--cell-size) var(--cell-size);background-repeat:no-repeat;border:1px solid rgba(255,255,255,.12);}
.c-ground{background-image:url(res/push_box_ground.png);}
.c-wall{background-image:url(res/push_box_wall.png);}
.c-target{background-image:url(res/push_box_target.png);}
.c-box{background-image:url(res/push_box_box.png);}
.c-box-ok{background-image:url(res/push_box_box_ok.png);}
.c-man{background-image:url(res/push_box_man.png);}
.c-man-tar{background-image:url(res/push_box_man.png),url(res/push_box_target.png);}
.cell{position:relative;}
.layer{position:absolute;inset:0;background-size:var(--cell-size) var(--cell-size);background-repeat:no-repeat;pointer-events:none;}
.layer.upper{opacity:1;}
.l-ground{background-image:url(res/push_box_ground.png);}
.l-wall{background-image:url(res/push_box_wall.png);}
.l-target{background-image:url(res/push_box_target.png);}
.u-man{background-image:url(res/push_box_man.png);}
.u-box{background-image:url(res/push_box_box.png);}
.u-box-ok{background-image:url(res/push_box_box_ok.png);}
/* 编辑态：角色压在目标上时，在角色之上补一个红点，提示下层是目标 */
.cell.show-under-target::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:#ff5a5a;
  box-shadow:0 0 3px #000, 0 0 5px rgba(255,90,90,.9);
  z-index:4;
  pointer-events:none;
}
.map-panel{width:100%;overflow:auto;padding:4px;}
.map-wrap{display:inline-block;min-width:100%;background:#111;border:1px solid rgba(255,255,255,.12);padding:8px;}
#editCanvas,#playCanvas{display:inline-block;position:relative;line-height:0;}
.row-line{display:flex;}
.cell{
  width:var(--cell-size);height:var(--cell-size);flex-shrink:0;
  background-size:var(--cell-size) var(--cell-size);background-repeat:no-repeat;
  border:1px solid rgba(0,0,0,.25);cursor:crosshair;touch-action:none;
}
#playCanvas .cell{cursor:pointer;}
.status{font-size:13px;color:#9ab;min-height:20px;}
.status.ok{color:#7f8;}
.status.bad{color:#f88;}
.hint{font-size:12px;color:#789;margin-top:8px;line-height:1.6;}
.play-hud{display:flex;gap:24px;margin-bottom:10px;font-size:14px;color:#7cf;font-family:monospace;}
.play-wrap{position:relative;display:inline-block;}
.win-mask{
  position:absolute;inset:0;background:rgba(0,0,0,.78);z-index:20;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;
}
.win-mask.show{display:flex;}
.win-mask strong{font-size:20px;color:#7cf;}
.win-mask span{font-size:12px;color:#b8d8ff;}
.library{display:flex;gap:14px;flex-wrap:wrap;}
.lib-col{flex:1;min-width:280px;}
.lib-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;}
#officialList{max-height:none;overflow:visible;}
.lib-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(20,28,40,.5);}
.lib-info{flex:1;min-width:0;}
.lib-name{font-size:13px;color:#dce8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lib-meta{font-size:11px;color:#789;margin-top:2px;}
.lib-empty{font-size:12px;color:#678;padding:10px 0;}
.saved-tip{font-size:11px;color:#7cf;opacity:0;transition:opacity .3s;}
.saved-tip.show{opacity:1;}
@media(max-width:560px){
  .panel{padding:12px;}
  .top-bar h1{font-size:17px;}
  .tab{padding:7px 10px;font-size:12px;}
}
</style>
</head>
<body>
<div class="game-editor">
  <div class="top-bar">
    <a class="back-link" href="index.html">← 返回游戏</a>
    <h1>正向推箱子关卡编辑器</h1>
    <span class="saved-tip" id="savedTip">草稿已自动保存</span>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabEdit">1. 编辑地图</div>
    <div class="tab disabled" id="tabPlay">2. 试玩通关</div>
  </div>

  <section class="panel" id="editPanel">
    <div class="row">
      <label>宽 <input type="number" id="mapCols" min="4" max="30" value="10" /></label>
      <label>高 <input type="number" id="mapRows" min="4" max="24" value="10" /></label>
      <button class="btn" id="btnResize">应用尺寸</button>
      <button class="btn" id="btnNew">新建空白</button>
      <button class="btn" id="btnUndo" disabled>撤销</button>
    </div>
    <div class="panel-title">元素画笔（点击格子绘制，可按住拖动）</div>
    <div class="palette" id="palette"></div>
    <div class="hint">地面画笔只改下层地形，不会删除箱子/小人；删除箱子请用箱子画笔点击已有箱子，绘制小人时会自动清除原有小人。必须放 1 个小人、至少 1 个箱子，且目标数等于箱子数。</div>
    <div class="map-panel" id="editMapPanel">
      <div class="map-wrap">
        <div id="editCanvas"></div>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="status" id="validStatus"></div>
      <button class="btn primary" id="btnPlay" style="margin-left:auto;">进入试玩</button>
    </div>
  </section>

  <section class="panel" id="playPanel" style="display:none;">
    <div class="play-hud">
      <span>剩余箱子：<b id="playLeft">0</b></span>
      <span>步数：<b id="playSteps">0</b></span>
    </div>
    <div class="map-panel" id="playMapPanel">
      <div class="play-wrap">
        <div id="playCanvas"></div>
        <div class="win-mask" id="winMask">
          <strong>试玩通关</strong>
          <span>通关后可保存为正式关卡</span>
          <button class="btn primary" id="btnSaveOfficial">保存为正式关卡</button>
        </div>
      </div>
    </div>
    <div class="hint">方向键移动；也可点击空地移动、点击相邻箱子推动。试玩中不能编辑地图，返回第一步后所有元素恢复为编辑时的位置。</div>
    <div class="row" style="margin-top:12px;">
      <button class="btn" id="btnResetPlay">重置试玩</button>
      <button class="btn" id="btnBackEdit">返回编辑</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">草稿与正式关卡</div>
    <div class="library">
      <div class="lib-col">
        <div class="panel-title">草稿（自动保存）</div>
        <div class="lib-list" id="draftList"></div>
      </div>
      <div class="lib-col">
        <div class="panel-title">正式关卡（试玩通关后保存）</div>
        <div class="lib-list" id="officialList"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';

var KEYS = { draft:'pb_editor_drafts_v1', official:'pb_editor_official_v1' };
var TOOLS = [
  { ch:' ', label:'地面', cls:'c-ground' },
  { ch:'#', label:'墙', cls:'c-wall' },
  { ch:'.', label:'目标', cls:'c-target' },
  { ch:'$', label:'箱子', cls:'c-box' },
  { ch:'@', label:'小人', cls:'c-man' }
];

var state = {
  step:1,
  name:'',
  rows:10,
  cols:10,
  grid:[],
  activeDraftId:null,
  tool:'#',
  play:null
};

function clone(g){ return g.map(function(r){ return r.slice(); }); }
function createGrid(rows, cols, ch){ var g=[]; for(var i=0;i<rows;i++){ var r=[]; for(var j=0;j<cols;j++) r.push(ch===undefined?' ':ch); g.push(r); } return g; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function timeText(ts){ var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function readStore(key){ try{ return JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ return []; } }
function writeStore(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){ alert('本地存储写入失败：' + e.message); } }

var saveTimer = null;
function showSavedTip(){
  var tip=document.getElementById('savedTip');
  tip.classList.add('show');
  clearTimeout(tip._t);
  tip._t=setTimeout(function(){ tip.classList.remove('show'); }, 1200);
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveDraft, 400);
}
function saveDraft(){
  if(state.step!==1) return;
  if(!state.activeDraftId) state.activeDraftId=uid();
  var rec={
    id:state.activeDraftId,
    name:state.name || '未命名草稿',
    rows:state.rows, cols:state.cols,
    grid:clone(state.grid),
    updatedAt:Date.now()
  };
  writeStore(KEYS.draft, [rec]);
  renderLibrary();
  showSavedTip();
}

var undoStack=[];
var MAX_UNDO=100;
function pushUndo(snap){
  undoStack.push(snap || {rows:state.rows,cols:state.cols,grid:clone(state.grid)});
  if(undoStack.length>MAX_UNDO) undoStack.shift();
  updateUndoBtn();
}
function updateUndoBtn(){
  var btn=document.getElementById('btnUndo');
  if(btn) btn.disabled=undoStack.length===0;
}
function undoEdit(){
  if(!undoStack.length) return;
  var snap=undoStack.pop();
  state.rows=snap.rows; state.cols=snap.cols; state.grid=clone(snap.grid);
  renderEditMap();
  updateUndoBtn();
  saveDraft();
}

function lowerClass(ch){
  if(ch==='#') return 'l-wall';
  if(ch==='.'||ch==='*'||ch==='!') return 'l-target';
  return 'l-ground';
}
function upperClass(ch, editMode){
  if(ch==='@'||ch==='!') return 'u-man';
  if(ch==='$') return 'u-box';
  if(ch==='*') return 'u-box-ok';
  return '';
}
function applyVisual(cell, ch, editMode){
  var lower=cell.querySelector('.lower');
  var upper=cell.querySelector('.upper');
  if(!lower||!upper) return;
  lower.className='layer lower '+lowerClass(ch);
  var u=upperClass(ch,editMode);
  upper.className='layer upper'+(u?' '+u:'');
  cell.classList.toggle('show-under-target', editMode && ch==='!');
}

function renderPalette(){
  var box=document.getElementById('palette');
  box.innerHTML='';
  TOOLS.forEach(function(t){
    var b=document.createElement('button');
    b.className='tool'+(t.ch===state.tool?' active':'');
    b.innerHTML='<span class="swatch '+t.cls+'"></span>'+t.label;
    b.onclick=function(){ state.tool=t.ch; renderPalette(); };
    box.appendChild(b);
  });
}

function fitCanvas(canvas, panel, cols){
  var BASE=32;
  var root=document.documentElement;
  root.style.setProperty('--cell-size', BASE+'px');
  var avail=panel.clientWidth - 24;
  var natural=cols*BASE;
  var size=BASE;
  if(natural>avail && avail>0) size=Math.max(8, Math.floor(BASE*avail/natural));
  root.style.setProperty('--cell-size', size+'px');
}

function buildGrid(canvas, grid, editable, editMode){
  canvas.innerHTML='';
  for(var i=0;i<grid.length;i++){
    var line=document.createElement('div');
    line.className='row-line';
    for(var j=0;j<grid[i].length;j++){
      var d=document.createElement('div');
      d.className='cell';
      d.dataset.l=i; d.dataset.c=j;
      var lower=document.createElement('div'); lower.className='layer lower';
      var upper=document.createElement('div'); upper.className='layer upper';
      d.appendChild(lower); d.appendChild(upper);
      applyVisual(d, grid[i][j], editMode);
      line.appendChild(d);
    }
    canvas.appendChild(line);
  }
  canvas.style.cursor=editable?'crosshair':'pointer';
}

function renderEditMap(){
  var canvas=document.getElementById('editCanvas');
  buildGrid(canvas, state.grid, true, true);
  fitCanvas(canvas, document.getElementById('editMapPanel'), state.cols);
  document.getElementById('mapRows').value=state.rows;
  document.getElementById('mapCols').value=state.cols;
  updateValidation();
}

function countChars(grid, chars){
  var n=0;
  for(var i=0;i<grid.length;i++) for(var j=0;j<grid[i].length;j++) if(chars.indexOf(grid[i][j])>=0) n++;
  return n;
}
function updateValidation(){
  var el=document.getElementById('validStatus');
  var men=countChars(state.grid,['@','!']);
  var boxes=countChars(state.grid,['$','*']);
  var targets=countChars(state.grid,['.','*','!']);
  var msg='', ok=false;
  if(men!==1) msg='必须有且只有 1 个小人（当前 '+men+'）';
  else if(boxes<1) msg='至少放置 1 个箱子';
  else if(targets!==boxes) msg='目标数必须等于箱子数（目标 '+targets+' / 箱子 '+boxes+'）';
  else { msg='校验通过：1 个小人，'+boxes+' 个箱子，'+targets+' 个目标'; ok=true; }
  el.textContent=msg;
  el.className='status '+(ok?'ok':'bad');
  document.getElementById('btnPlay').disabled=!ok;
}

var painting=false, lastPaintKey='';
function paintFromEvent(e){
  var t=e.target.closest('.cell');
  if(!t) return;
  paintCell(+t.dataset.l, +t.dataset.c);
}
function resolveChar(tool, old){
  var onTarget=(old==='.'||old==='*'||old==='!');
  if(tool==='$'){
    if(old==='$') return ' ';
    if(old==='*') return '.';
    return onTarget?'*':'$';
  }
  if(tool==='@') return onTarget?'!':'@';
  if(tool==='.'){
    if(old==='$'||old==='*') return '*';
    if(old==='@'||old==='!') return '!';
    return '.';
  }
  if(tool==='*'||tool==='!') return tool;
  if(tool===' '){
    if(old==='$'||old==='*') return '$';
    if(old==='@'||old==='!') return '@';
    return ' ';
  }
  return tool;
}
function paintCell(l,c){
  if(l<0||c<0||l>=state.rows||c>=state.cols) return;
  var key=l+','+c;
  if(key===lastPaintKey) return;
  lastPaintKey=key;
  var snap={rows:state.rows,cols:state.cols,grid:clone(state.grid)};
  var old=state.grid[l][c];
  var ch=resolveChar(state.tool, old);
  if(state.tool==='@'||state.tool==='!'){
    for(var i=0;i<state.rows;i++) for(var j=0;j<state.cols;j++){
      if(state.grid[i][j]!=='@'&&state.grid[i][j]!=='!') continue;
      state.grid[i][j]=(state.grid[i][j]==='!'?'.':' ');
      var cleared=document.querySelector('#editCanvas .cell[data-l="'+i+'"][data-c="'+j+'"]');
      if(cleared) applyVisual(cleared, state.grid[i][j], true);
    }
  }
  if(state.grid[l][c]!==ch){
    state.grid[l][c]=ch;
    var cell=document.querySelector('#editCanvas .cell[data-l="'+l+'"][data-c="'+c+'"]');
    if(cell) applyVisual(cell,ch,true);
  }
  var changed=false;
  for(var a=0;a<state.rows&&!changed;a++)
    for(var b=0;b<state.cols;b++)
      if(state.grid[a][b]!==snap.grid[a][b]){ changed=true; break; }
  if(changed){
    pushUndo(snap);
    updateValidation();
    scheduleSave();
  }
}

function renderLibrary(){
  var drafts=readStore(KEYS.draft), official=readStore(KEYS.official);
  var dl=document.getElementById('draftList');
  var ol=document.getElementById('officialList');
  dl.innerHTML=''; ol.innerHTML='';
  if(!drafts.length) dl.innerHTML='<div class="lib-empty">暂无草稿</div>';
  if(!official.length) ol.innerHTML='<div class="lib-empty">暂无正式关卡（试玩通关后可保存）</div>';
  drafts.forEach(function(rec){
    var d=document.createElement('div'); d.className='lib-item';
    d.innerHTML='<div class="lib-info"><div class="lib-name">'+esc(rec.name)+'</div><div class="lib-meta">'+rec.cols+'×'+rec.rows+' · '+timeText(rec.updatedAt)+'</div></div>';
    var load=document.createElement('button'); load.className='btn'; load.textContent='加载'; load.onclick=function(){ loadRecord(rec,true); };
    var del=document.createElement('button'); del.className='btn danger'; del.textContent='删除'; del.onclick=function(){ if(confirm('删除草稿「'+rec.name+'」？')){ writeStore(KEYS.draft, readStore(KEYS.draft).filter(function(x){return x.id!==rec.id;})); renderLibrary(); } };
    d.appendChild(load); d.appendChild(del); dl.appendChild(d);
  });
  official.forEach(function(rec){
    var d=document.createElement('div'); d.className='lib-item';
    d.innerHTML='<div class="lib-info"><div class="lib-name">'+esc(rec.name)+'</div><div class="lib-meta">'+rec.cols+'×'+rec.rows+' · '+timeText(rec.createdAt)+(rec.solvedSteps?' · '+rec.solvedSteps+' 步':'')+'</div></div>';
    var load=document.createElement('button'); load.className='btn'; load.textContent='加载'; load.onclick=function(){ loadRecord(rec,false); };
    var down=document.createElement('button'); down.className='btn'; down.textContent='下载'; down.onclick=function(){ downloadLevel(rec); };
    var del=document.createElement('button'); del.className='btn danger'; del.textContent='删除'; del.onclick=function(){
      if(!confirm('删除正式关卡「'+rec.name+'」？')) return;
      writeStore(KEYS.official, readStore(KEYS.official).filter(function(x){ return x.id!==rec.id; }));
      renderLibrary();
    };
    d.appendChild(load); d.appendChild(down); d.appendChild(del); ol.appendChild(d);
  });

  function loadRecord(rec, isDraft){
    state.name=rec.name; state.rows=rec.rows; state.cols=rec.cols;
    state.grid=clone(rec.grid);
    state.activeDraftId=isDraft?rec.id:null;
    state.play=null; state.step=1;
    undoStack=[]; updateUndoBtn();
    switchStep(1);
  }
}

function switchStep(step){
  state.step=step;
  document.getElementById('editPanel').style.display=step===1?'block':'none';
  document.getElementById('playPanel').style.display=step===2?'block':'none';
  document.getElementById('tabEdit').classList.toggle('active',step===1);
  document.getElementById('tabPlay').classList.toggle('active',step===2);
  document.getElementById('tabPlay').classList.toggle('disabled',step===1);
  if(step===1) renderEditMap();
}

function emptyPlay(ch){ return ch===' '||ch==='.'; }
function boxPlay(ch){ return ch==='$'||ch==='*'; }
function findMan(g){
  for(var i=0;i<g.length;i++) for(var j=0;j<g[i].length;j++) if(g[i][j]==='@'||g[i][j]==='!') return {l:i,c:j};
  return null;
}
function countBoxes(g){ return countChars(g,['$']); }
function findPathPlay(g, start, target){
  var key=function(l,c){ return l+','+c; };
  var q=[[start.l,start.c]], prev={}; prev[key(start.l,start.c)]=null;
  var dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  while(q.length){
    var cur=q.shift();
    if(cur[0]===target.l&&cur[1]===target.c) break;
    for(var d=0;d<dirs.length;d++){
      var nl=cur[0]+dirs[d][0], nc=cur[1]+dirs[d][1], k=key(nl,nc);
      if(nl<0||nc<0||nl>=g.length||nc>=g[0].length) continue;
      if(!emptyPlay(g[nl][nc])||prev[k]!==undefined) continue;
      prev[k]={l:cur[0],c:cur[1]}; q.push([nl,nc]);
    }
  }
  var tk=key(target.l,target.c);
  if(prev[tk]===undefined) return null;
  var path=[], cur={l:target.l,c:target.c};
  while(cur && (cur.l!==start.l||cur.c!==start.c)){ path.unshift(cur); cur=prev[key(cur.l,cur.c)]; }
  return path;
}

function updatePlayHud(){
  document.getElementById('playLeft').textContent=state.play?state.play.boxesLeft:0;
  document.getElementById('playSteps').textContent=state.play?state.play.steps:0;
}
function renderPlayMap(){
  buildGrid(document.getElementById('playCanvas'), state.play.grid, false, false);
  fitCanvas(document.getElementById('playCanvas'), document.getElementById('playMapPanel'), state.cols);
  updatePlayHud();
}
function startPlay(){
  saveDraft();
  state.play={ grid:clone(state.grid), steps:0, boxesLeft:countBoxes(state.grid), won:false };
  document.getElementById('winMask').classList.remove('show');
  switchStep(2);
  renderPlayMap();
}
function playStep(l,c){
  var p=state.play;
  if(!p||p.won) return;
  var g=p.grid;
  if(l<0||c<0||l>=g.length||c>=g[0].length) return;
  var man=findMan(g); if(!man) return;
  if(emptyPlay(g[l][c])){
    var path=findPathPlay(g,man,{l:l,c:c});
    if(!path||!path.length) return;
    var old=g[man.l][man.c];
    g[man.l][man.c]=(old==='!'?'.':' ');
    var dest=g[l][c];
    g[l][c]=(dest==='.'?'!':'@');
    p.steps+=path.length;
  } else if(boxPlay(g[l][c])){
    if(Math.abs(l-man.l)+Math.abs(c-man.c)!==1) return;
    var dl=l-man.l, dc=c-man.c;
    var bl=l+dl, bc=c+dc;
    if(bl<0||bc<0||bl>=g.length||bc>=g[0].length||!emptyPlay(g[bl][bc])) return;
    var oldMan=g[man.l][man.c];
    var oldBox=g[l][c];
    var oldDest=g[bl][bc];
    g[man.l][man.c]=(oldMan==='!'?'.':' ');
    g[l][c]=(oldBox==='*'?'!':'@');
    g[bl][bc]=(oldDest==='.'?'*':'$');
    p.steps++;
  } else return;
  p.boxesLeft=countBoxes(g);
  renderPlayMap();
  if(p.boxesLeft===0){
    p.won=true;
    document.getElementById('winMask').classList.add('show');
  }
}
function resetPlay(){
  if(!state.play) return;
  state.play.grid=clone(state.grid);
  state.play.steps=0;
  state.play.boxesLeft=countBoxes(state.grid);
  state.play.won=false;
  document.getElementById('winMask').classList.remove('show');
  renderPlayMap();
}
function backToEdit(){
  state.play=null;
  document.getElementById('winMask').classList.remove('show');
  switchStep(1);
  renderLibrary();
}
function levelText(rec){
  return rec.grid.map(function(r){ return r.join(''); }).join('\n').replace(/[\s\n]+$/,'')+'\n\n';
}
function downloadLevel(rec){
  var blob=new Blob([levelText(rec)],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='screen.'+(rec.fileNo||1);
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function saveOfficial(){
  if(!state.play||!state.play.won) return;
  var def=state.name||('正式关卡 '+ (readStore(KEYS.official).length+1));
  var name=prompt('请输入正式关卡名称：', def);
  if(name===null) return;
  name=name.trim()||def;
  var list=readStore(KEYS.official);
  var maxNo=0;
  for(var i=0;i<list.length;i++) if((list[i].fileNo||0)>maxNo) maxNo=list[i].fileNo;
  var rec={
    id:uid(), name:name,
    rows:state.rows, cols:state.cols,
    grid:clone(state.grid),
    createdAt:Date.now(),
    solvedSteps:state.play.steps,
    fileNo:maxNo+1
  };
  list.push(rec);
  writeStore(KEYS.official,list);
  renderLibrary();
  alert('已保存为正式关卡：'+rec.name);
  state.activeDraftId=null;
  state.name='';
  state.rows=10;
  state.cols=10;
  state.grid=createGrid(10,10,' ');
  backToEdit();
  saveDraft();
}

function bind(){
  var drafts=readStore(KEYS.draft);
  if(drafts.length){
    var rec=drafts[0];
    state.name=rec.name;
    state.rows=rec.rows;
    state.cols=rec.cols;
    state.grid=clone(rec.grid);
    state.activeDraftId=rec.id;
    writeStore(KEYS.draft, [rec]);
  }
  if(!state.grid.length) state.grid=createGrid(state.rows,state.cols,' ');
  renderPalette();
  renderEditMap();
  renderLibrary();
  if(!drafts.length) saveDraft();

  var canvas=document.getElementById('editCanvas');
  canvas.addEventListener('pointerdown',function(e){
    painting=true;
    lastPaintKey='';
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    paintFromEvent(e);
    e.preventDefault();
  });
  canvas.addEventListener('pointerover',function(e){ if(painting) paintFromEvent(e); });
  canvas.addEventListener('pointermove',function(e){
    if(!painting) return;
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var cell=el && el.closest ? el.closest('.cell') : null;
    if(cell && canvas.contains(cell)) paintCell(+cell.dataset.l,+cell.dataset.c);
    e.preventDefault();
  });
  window.addEventListener('pointerup',function(){ painting=false; });
  window.addEventListener('pointercancel',function(){ painting=false; });

  document.getElementById('btnResize').onclick=function(){
    var r=Math.max(4,Math.min(24,parseInt(document.getElementById('mapRows').value,10)||10));
    var c=Math.max(4,Math.min(30,parseInt(document.getElementById('mapCols').value,10)||10));
    if(r===state.rows&&c===state.cols) return;
    pushUndo();
    var g=createGrid(r,c,' ');
    for(var i=0;i<Math.min(r,state.rows);i++) for(var j=0;j<Math.min(c,state.cols);j++) g[i][j]=state.grid[i][j];
    state.rows=r; state.cols=c; state.grid=g;
    renderEditMap(); saveDraft();
  };
  document.getElementById('btnNew').onclick=function(){
    if(!confirm('新建空白地图？当前草稿会被覆盖。')) return;
    pushUndo();
    state.activeDraftId=null; state.name=''; state.grid=createGrid(10,10,' ');
    state.rows=10; state.cols=10;
    renderEditMap(); saveDraft();
  };
  document.getElementById('btnUndo').onclick=undoEdit;
  document.getElementById('btnPlay').onclick=startPlay;
  document.getElementById('btnResetPlay').onclick=resetPlay;
  document.getElementById('btnBackEdit').onclick=backToEdit;
  document.getElementById('btnSaveOfficial').onclick=saveOfficial;

  document.getElementById('playCanvas').addEventListener('click',function(e){
    var t=e.target.closest('.cell'); if(!t) return;
    playStep(+t.dataset.l,+t.dataset.c);
  });
  document.addEventListener('keydown',function(e){
    if(state.step!==2||!state.play||state.play.won) return;
    var man=findMan(state.play.grid); if(!man) return;
    var dl=0,dc=0;
    if(e.key==='ArrowUp') dl=-1; else if(e.key==='ArrowDown') dl=1;
    else if(e.key==='ArrowLeft') dc=-1; else if(e.key==='ArrowRight') dc=1; else return;
    e.preventDefault();
    playStep(man.l+dl, man.c+dc);
  });
  window.addEventListener('resize',function(){
    if(state.step===1) fitCanvas(document.getElementById('editCanvas'),document.getElementById('editMapPanel'),state.cols);
    else if(state.play) fitCanvas(document.getElementById('playCanvas'),document.getElementById('playMapPanel'),state.cols);
  });
  updateUndoBtn();
}

bind();
})();
</script>
