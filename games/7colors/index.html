<style>
  :root{
    --bg:#0f1320; --panel:#171c2b; --card:#1d2436; --ink:#eef2ff; --muted:#9aa6c4;

  .board-wrap{position:relative; padding:4px;}
  /* 缝隙填充层：覆盖在棋盘上，仅在相邻连通格之间绘制同色色条，填满 2px 间隙 */
  #links{position:absolute; top:4px; left:4px; pointer-events:none; z-index:1; border-radius:8px;}

  .cell.pop{animation:pop .32s ease;}
  /* 悬停预览：即将被吞并的方格「亮暗闪烁」以提示 */
  .cell.preview{ animation:prevBlink 1.3s ease-in-out infinite; z-index:1; }
  @keyframes prevBlink{0%,100%{filter:brightness(.68);}50%{filter:brightness(1.08);}}
  @keyframes pop{0%{transform:scale(.55);}60%{transform:scale(1.12);}100%{transform:scale(1);}}

  .palette{width:100%; max-width:520px; display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .palette button{
    width:62px; height:31px; border-radius:10px; border:2px solid rgba(255,255,255,.15); cursor:pointer;
    color:#fff; font-weight:800; position:relative;

    font-family:inherit; transition:transform .12s, box-shadow .12s, opacity .12s;
  }
  .palette button .k{font-size:18px; line-height:1;}
  .palette button .g{font-size:11px; opacity:.9; margin-top:3px; font-weight:600;}
  .palette button:hover:not(:disabled){transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,.35);}
  /* 无法点击（与基地同色）的按钮：不变暗，中心显示白色锁图标 */
  .palette button:disabled{ cursor:not-allowed; }
  .palette button:disabled::before{
    content:''; position:absolute; left:50%; top:calc(50% + 3px); transform:translate(-50%,-50%);
    width:13px; height:10px; border-radius:2px; background:rgba(255,255,255,.95);
  }
  .palette button:disabled::after{
    content:''; position:absolute; left:50%; top:calc(50% - 3px); transform:translate(-50%,-50%);

  .hint{color:var(--muted); font-size:12px; margin-top:10px; text-align:center; line-height:1.7;}

<script>
const SIZE=21, C=10;
const COLORS=[
  {id:0,name:'红',hex:'#e8503a'},
  {id:1,name:'橙',hex:'#f0932b'},
  {id:2,name:'黄',hex:'#f6d55c'},
  {id:3,name:'绿',hex:'#3fa96a'},
  {id:4,name:'青',hex:'#2bb3c0'},
  {id:5,name:'蓝',hex:'#4a6fe3'},
  {id:6,name:'紫',hex:'#9b59b6'},
];
const half  = r => Math.min(r, SIZE-1-r);
const valid = (r,c) => Math.abs(c-C) <= half(r);
// 有效格子总数（菱形棋盘，四角为无效格，不计入领地/终局判定）
const TOTAL = (() => { let n=0; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(valid(r,c)) n++; return n; })();
const idx   = (r,c) => r*SIZE+c;
const neighbors4 = i => {
  const r=(i/SIZE)|0, c=i%SIZE, out=[];
  if(r>0)        out.push(i-SIZE);
  if(r<SIZE-1)   out.push(i+SIZE);
  if(c>0)        out.push(i-1);
  if(c<SIZE-1)   out.push(i+1);
  return out.filter(n=>valid((n/SIZE)|0, n%SIZE));
};

// 状态
let grid, playerRegion, aiRegion, playerColor, aiColor;
let turn, locked, over, winner, difficulty='normal';

document.getElementById('heroDots').innerHTML = COLORS.map(c=>`<i style="background:${c.hex}"></i>`).join('');

// 棋盘 DOM
const board=document.getElementById('board');
const cellEls=[];
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
  const d=document.createElement('div');
  const i=idx(r,c);
  if(!valid(r,c)){ d.className='cell invalid'; }
  else { d.className='cell'; }
  cellEls.push(d); board.appendChild(d);
}
const pBase=idx(SIZE-1,C), aBase=idx(0,C);
cellEls[pBase].classList.add('base-p'); cellEls[pBase].textContent='你';
cellEls[aBase].classList.add('base-a'); cellEls[aBase].textContent='AI';

// 缝隙填充层：仅在相邻「连通」格之间绘制同色色条，填满 2px 间隙；与中立格的边界保持间隙
const links=document.getElementById('links');
const lctx=links.getContext('2d');
const GAP=2, R=3; // 间隙 2px；填充条两端各缩 R（圆角半径），形成居中的连接段
function setupLinks(){
  const w=board.clientWidth, h=board.clientHeight;
  const dpr=window.devicePixelRatio||1;
  links.width=Math.max(1,Math.round(w*dpr)); links.height=Math.max(1,Math.round(h*dpr));
  links.style.width=w+'px'; links.style.height=h+'px';
  lctx.setTransform(dpr,0,0,dpr,0,0);
}
function cellRect(r,c){
  const w=board.clientWidth;
  const cw=(w-GAP*(SIZE-1))/SIZE;
  return {x:c*(cw+GAP), y:r*(cw+GAP), w:cw, h:cw};
}
// 在区域内部相邻格（仅右/下，避免重复）之间绘制缝隙色条
function drawSeams(region, hex){
  lctx.fillStyle=hex;
  for(const i of region){
    const r=(i/SIZE)|0, c=i%SIZE, rc=cellRect(r,c);
    const ri=i+1; if(ri%SIZE!==0 && (ri/SIZE|0)===r && region.has(ri)) lctx.fillRect(rc.x+rc.w, rc.y+R, GAP, rc.h-2*R);
    const di=i+SIZE; if(di<SIZE*SIZE && region.has(di)) lctx.fillRect(rc.x+R, rc.y+rc.h, rc.w-2*R, GAP);
  }
}
// 增量绘制：仅对「已点亮」集合 lit 内、且两端都已点亮的相邻格补画缝隙，
// 不清画布，因此原有缝隙不会消失，并随方块一起按新色逐层铺开
function drawSeamsLit(lit, hex){
  lctx.fillStyle=hex;
  for(const i of lit){
    const r=(i/SIZE)|0, c=i%SIZE, rc=cellRect(r,c);
    const ri=i+1;    if(ri%SIZE!==0 && (ri/SIZE|0)===r && lit.has(ri)) lctx.fillRect(rc.x+rc.w, rc.y+R, GAP, rc.h-2*R);
    const le=i-1;    if(c!==0        && (le/SIZE|0)===r && lit.has(le)) lctx.fillRect(rc.x-GAP, rc.y+R, GAP, rc.h-2*R);
    const di=i+SIZE; if(di<SIZE*SIZE              && lit.has(di)) lctx.fillRect(rc.x+R, rc.y+rc.h, rc.w-2*R, GAP);
    const up=i-SIZE; if(up>=0                     && lit.has(up)) lctx.fillRect(rc.x+R, rc.y-GAP, rc.w-2*R, GAP);
  }
}
function drawLinks(opts){
  lctx.clearRect(0,0,board.clientWidth, board.clientHeight);
  const pr=(opts&&opts.player)?opts.player:playerRegion;
  const ar=(opts&&opts.ai)?opts.ai:aiRegion;
  drawSeams(pr, COLORS[playerColor].hex);
  drawSeams(ar, COLORS[aiColor].hex);
}

function paintCell(i){
  if(grid[i]<0){ cellEls[i].style.background='transparent'; return; }
  cellEls[i].style.background=COLORS[grid[i]].hex;
}
function pulse(i){ const e=cellEls[i]; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }

// 给已连通的领地打上归属描边（基地除外，基地有白环）
function markAll(){
  for(let i=0;i<SIZE*SIZE;i++) cellEls[i].classList.remove('mine','theirs');
  for(const i of playerRegion) if(i!==pBase) cellEls[i].classList.add('mine');
  for(const i of aiRegion)     if(i!==aBase) cellEls[i].classList.add('theirs');
}

function init(){
  grid=new Int8Array(SIZE*SIZE).fill(-1);
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(valid(r,c)) grid[idx(r,c)]=(Math.random()*7)|0;
  // 基地异色
  let pc=grid[pBase], ac=grid[aBase];
  if(pc===ac){ pc=(pc+1+((Math.random()*6)|0))%7; grid[pBase]=pc; }
  playerColor=pc; aiColor=ac;
  playerRegion=new Set([pBase]); aiRegion=new Set([aBase]);
  floodInit(playerRegion); floodInit(aiRegion);
  turn='player'; locked=false; over=false; winner=null;
  document.getElementById('overlay').classList.remove('show');
  for(let i=0;i<SIZE*SIZE;i++) if(grid[i]>=0) paintCell(i);
  markAll();
  setupLinks();
  drawLinks();
  clearPreview();
  diffColors();
}

function floodInit(region){
  const start=[...region][0];
  const target=grid[start];
  const seen=new Set(region), q=[start];
  while(q.length){ const cur=q.shift();
    for(const nb of neighbors4(cur)){ if(seen.has(nb))continue; if(grid[nb]!==target)continue; seen.add(nb); q.push(nb); region.add(nb); }
  }
}

// 在状态上计算并应用一次扩散（真实走子）
function applyMove(side, target){
  const region = side===1?playerRegion:aiRegion;
  const seen=new Set(region), q=[...region], gained=[];
  while(q.length){ const cur=q.shift();
    for(const nb of neighbors4(cur)){ if(seen.has(nb))continue; if(grid[nb]!==target)continue; seen.add(nb); q.push(nb); gained.push(nb); }
  }
  const all=[...region, ...gained];
  for(const i of all){ grid[i]=target; region.add(i); }
  if(side===1) playerColor=target; else aiColor=target;
  return gained;
}

// 带动画的真实走子：扩散波从「基地」向外辐射
function animateMove(side, target, done){
  const region = side===1?playerRegion:aiRegion;
  const base = side===1?pBase:aBase;
  // 1. 找出将并入的格子
  const seen=new Set(region), q=[...region], gained=[];
  while(q.length){ const cur=q.shift();
    for(const nb of neighbors4(cur)){ if(seen.has(nb))continue; if(grid[nb]!==target)continue; seen.add(nb); q.push(nb); gained.push(nb); }
  }
  const finalSet=new Set([...region, ...gained]);
  // 2. 逻辑立即更新（颜色 + 归属集合）
  for(const i of finalSet) grid[i]=target;
  gained.forEach(i=>region.add(i));
  if(side===1) playerColor=target; else aiColor=target;
  // 从基地开始随波纹逐格点亮（含旧领地），颜色与相邻缝隙同步从基地向外传播
  const lit=new Set();
  // 3. 从基地做 BFS，算出每个格子到基地的「层数」
  const depth=new Map(); depth.set(base,0);
  const bq=[base]; let maxDepth=0;
  while(bq.length){ const cur=bq.shift(); const d=depth.get(cur);
    for(const nb of neighbors4(cur)){ if(!finalSet.has(nb)||depth.has(nb))continue; depth.set(nb,d+1); if(d+1>maxDepth)maxDepth=d+1; bq.push(nb); }
  }
  // 4. 按层数波浪上色（基地 d=0 最先），逐格点亮领地描边，并让缝隙随波纹逐步填充
  //    同一层的格子同时点亮，并为该层播放一个音阶音（按传播进度百分比映射到 do→do）
  const byDepth = [];
  for(let d=0; d<=maxDepth; d++) byDepth.push([]);
  for(const [i,d] of depth) byDepth[d].push(i);
  for(let d=0; d<=maxDepth; d++){
    setTimeout(()=>{
      for(const i of byDepth[d]){
        paintCell(i); pulse(i);
        if(i!==base) cellEls[i].classList.add(side===1?'mine':'theirs');
        lit.add(i);
      }
      drawSeamsLit(lit, COLORS[target].hex);
      const pct = maxDepth>0 ? d/maxDepth : 1;
      const note = SCALE[Math.round(pct*(SCALE.length-1))];
      tone(note, 0.10, 'triangle', 0, 0.14);
    }, d*42);
  }
  setTimeout(()=>{ drawLinks(); done(); }, maxDepth*42 + 110);
}

// 模拟（AI 评估用）
function cloneState(){ return {grid:grid.slice(), playerRegion:new Set(playerRegion), aiRegion:new Set(aiRegion)}; }
function simGain(state, side, target){
  const region = side===1?state.playerRegion:state.aiRegion;
  const seen=new Set(region), q=[...region]; let n=0;
  while(q.length){ const cur=q.shift();
    for(const nb of neighbors4(cur)){ if(seen.has(nb))continue; if(state.grid[nb]!==target)continue; seen.add(nb); q.push(nb); n++; }
  }
  [...region, ...seen].forEach(i=>{ state.grid[i]=target; region.add(i); });
  return n;
}

function aiChoose(){
  const options=[]; for(let c=0;c<7;c++) if(c!==playerColor && c!==aiColor) options.push(c);
  if(difficulty==='easy') return options[(Math.random()*options.length)|0];
  let best=-1e9, pick=options[0];
  for(const c of options){
    const sim=cloneState(); const g=simGain(sim,2,c);
    let score=g;
    if(difficulty==='hard'){
      const oppOpts=[]; for(let x=0;x<7;x++) if(x!==playerColor && x!==c) oppOpts.push(x);
      let oppBest=0;
      for(const x of oppOpts){ const s2={grid:sim.grid.slice(), playerRegion:new Set(sim.playerRegion), aiRegion:new Set(sim.aiRegion)}; oppBest=Math.max(oppBest, simGain(s2,1,x)); }
      score = g - 0.8*oppBest;
    }
    if(score>best){ best=score; pick=c; }
  }
  return pick;
}

// 结束条件：所有方块都已被双方占据（棋盘填满）
function checkEnd(){ return playerRegion.size + aiRegion.size >= TOTAL; }

// 预览：若玩家选 colorId，将被新吞并的格子（只读，不改真实状态）
function captureSet(target){
  const seen=new Set(playerRegion), q=[...playerRegion], out=[];
  while(q.length){ const cur=q.shift();
    for(const nb of neighbors4(cur)){ if(seen.has(nb))continue; if(grid[nb]!==target)continue; seen.add(nb); q.push(nb); out.push(nb); }
  }
  return out;
}
let previewList=[];
function showPreview(colorId){
  clearPreview();
  if(locked||over||colorId===playerColor||colorId===aiColor) return;
  previewList = captureSet(colorId);
  previewList.forEach(i=> cellEls[i].classList.add('preview'));
}
function clearPreview(){
  previewList.forEach(i=> cellEls[i].classList.remove('preview'));
  previewList=[];
}

function endGame(){
  over=true; locked=true;
  const p=playerRegion.size, a=aiRegion.size;
  winner = p>a?1 : (a>p?2 : 0);
  document.getElementById('result').textContent = winner===1?'你赢了！' : winner===2?'机器人赢了' : '平局';
  document.getElementById('resultDetail').textContent = `你的领地 ${p} 格 · 机器人 ${a} 格`;
  document.getElementById('overlay').classList.add('show');
  if(winner===1) sndWin(); else if(winner===2) sndLose(); else sndDraw();
}

// ============ 音效（Web Audio 合成，无需音频文件） ============
let audioCtx = null;
let soundOn = true;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, when, vol){
  if(!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function sndMove(side){
  ensureAudio();
  if(side === 1){ tone(523, 0.12, 'triangle', 0, 0.16); tone(784, 0.10, 'triangle', 0.06, 0.12); }
  else { tone(330, 0.12, 'sawtooth', 0, 0.12); tone(247, 0.10, 'sawtooth', 0.06, 0.09); }
}
function sndWin(){ ensureAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',i*0.10,0.18)); }
function sndLose(){ ensureAudio(); [392,330,262,196].forEach((f,i)=>tone(f,0.22,'sawtooth',i*0.10,0.16)); }
function sndDraw(){ ensureAudio(); tone(440,0.18,'sine',0,0.14); tone(440,0.18,'sine',0.12,0.10); }

// 渲染分数与按钮
function diffColors(){
  const p=playerRegion.size, a=aiRegion.size, total=221;

  const st=document.getElementById('status');
  st.innerHTML = `你 <b>${p}</b> · AI <b>${a}</b> · 中立 <b>${total-p-a}</b>` + (turn==='player'?' · 轮到你':'');

  const pal=document.getElementById('palette'); pal.innerHTML='';
  for(const col of COLORS){
    const b=document.createElement('button');
    b.style.background=col.hex;
    const disabled = col.id===playerColor || col.id===aiColor;
    b.disabled=disabled;
    b.title = col.name + (disabled?'（与基地同色，禁用）':'：悬停预览将吞并的方格');
    b.onclick=()=>onPlayerPick(col.id);
    b.onmouseenter=()=>showPreview(col.id);
    b.onmouseleave=clearPreview;
    pal.appendChild(b);
  }
}

function onPlayerPick(c){
  if(locked||over||turn!=='player') return;
  if(c===playerColor||c===aiColor) return;
  clearPreview();
  ensureAudio(); sndMove(1);
  locked=true; turn='ai';
  document.getElementById('status').textContent='你走完，AI 思考中…';
  animateMove(1, c, ()=>{
    diffColors();
    if(checkEnd()){ endGame(); return; }
    setTimeout(()=>{
      const ac=aiChoose();
      sndMove(2);
      animateMove(2, ac, ()=>{
        diffColors();
        if(checkEnd()){ endGame(); return; }
        turn='player'; locked=false; diffColors();
      });
    }, 380);
  });
}
