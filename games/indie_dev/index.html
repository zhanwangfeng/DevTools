<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>独立制作人 · Starfall Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230d1117'/%3E%3Cpath d='M12 3l2.4 5.1 5.6.7-4.1 3.8 1.1 5.5L12 15.5 7 18.1l1.1-5.5L4 8.8l5.6-.7z' fill='%2300e5ff'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   视觉风格：孟菲斯波普（Memphis / Pop）
   结构层与风格层分离：布局规则不动，风格只落在 :root 变量与少量质感规则上
   ========================================================================== */
:root{
  /* —— 形状 / 质感旋钮 —— */
  --r:.7;                     /* 圆角倍率 */
  --bw:3px;                   /* 粗黑描边 */
  --font:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --panel-blur:none;
  --shadow-card:9px 9px 0 #1A1A1A;   /* 硬投影：无模糊、直接偏移 */
  --shadow-pop:8px 8px 0 #1A1A1A;
  --shadow-sm:5px 5px 0 #1A1A1A;
  --ov:rgba(26,26,26,.72);
  /* —— 色板：奶白底 + 高饱和撞色 —— */
  --bg:#FFF8EE; --panel:#FFFFFF; --panel2:#FFFCF2;
  --line:#1A1A1A; --ink:#1A1A1A; --dim:#6E6E6E;
  --cy:#FF4B3E; --ma:#E8467F; --go:#E8A600; --bl:#1899D6; --gr:#0E9B57;
  --bl-rgb:24,153,214;                                       /* 湖蓝 rgb，供 rgba 用 */
  --red-rgb:255,75,62;                                       /* 朱红 rgb，供 rgba 用 */
  --red:#FF4B3E; --on-cy:#1A1A1A;
  --c1:#FFD400; --c2:#2EC4FF; --c3:#FF6FB1; --c4:#3DDC97;   /* 资源卡四色块 */
  --c5:#9B5DE5;                                              /* 进度专用色（紫） */
  /* —— 卡面（决策卡）：亮色几何拼贴 —— */
  --face-bg:#FFF8EE;
  --face-veil:255,248,238;    /* rgb 三元组：卡面遮罩渐变（亮色） */
  --face-stroke:255,248,238;  /* rgb 三元组：卡面文字描边 / 外发光 */
  --face-ink:#1A1A1A;
  --face-line:rgba(26,26,26,.45);
  --face-stroke-w:3px;
  /* 卡面文字描边用白、外发光用黑（覆盖默认同色描边/发光） */
  --face-stroke:255,255,255;        /* 描边色：白色 */
  --face-glow:0,0,0;                /* 外发光色：黑色 */
  --f-gr:#0E7A4A;             /* 卡面上的「涨」色 */
  --f-red:#C1272D;            /* 卡面上的「跌」色 */
  /* —— 页面底色 / 彩色圆点纹理 —— */
  --bg-fx:none;
  --tex-fx:radial-gradient(circle at 11% 15%,#FFD400 0 12px,transparent 13px),
           radial-gradient(circle at 89% 24%,#2EC4FF 0 16px,transparent 17px),
           radial-gradient(circle at 80% 80%,#FF4B3E 0 11px,transparent 12px),
           radial-gradient(circle at 17% 74%,#3DDC97 0 14px,transparent 15px),
           radial-gradient(circle at 50% 47%,#FF6FB1 0 9px,transparent 10px),
           radial-gradient(circle at 34% 90%,#FFD400 0 7px,transparent 8px),
           radial-gradient(circle at 68% 8%,#3DDC97 0 8px,transparent 9px);
  --tex-op:.9; --tex-blend:normal;
  --scan-fx:none; --scan-op:0;
  --ratio:16/9;
}


*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:var(--bg-fx);
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  padding:26px; min-height:100vh;
}
/* 纹理层与扫描线层（主题按需开启），不参与布局、不吃事件 */
body::before,body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
}
body::before{background-image:var(--tex-fx);opacity:var(--tex-op);mix-blend-mode:var(--tex-blend)}
body::after{background-image:var(--scan-fx);opacity:var(--scan-op)}

/* 固定手机宽度：桌面再大也不拉伸；窄屏由 fitUI 整体等比缩小 */
.fit{width:624px;flex:none;transform-origin:top left}
.wrap{width:624px;max-width:100%;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:19px;flex-wrap:wrap}
.logo{font-size:29px;font-weight:700;letter-spacing:1px;color:var(--cy)}
.logo span{color:var(--dim);font-weight:400}
.quarter{font-size:19px;color:var(--dim)}
/* 完成度 */
.prog-label{display:flex;justify-content:space-between;font-size:18px;color:var(--dim);margin-bottom:6px}
.prog{height:19px;border:var(--bw) solid var(--line);border-radius:calc(10px * var(--r));background:var(--panel);overflow:hidden}
.prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--bl),var(--cy));transition:width .5s ease}
/* 资源条：四个一行 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{position:relative;background:var(--panel);border:var(--bw) solid var(--line);border-radius:calc(16px * var(--r));padding:14px 13px;display:flex;align-items:center;-webkit-backdrop-filter:var(--panel-blur);backdrop-filter:var(--panel-blur)}
.stat .top{display:flex;align-items:center;gap:6px;font-size:18px;width:100%}
.stat .top svg{width:19px;height:19px;flex:none}
.stat .top b{flex:1;font-weight:600}
.stat .num{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;display:inline-block}
/* 变化量飘字：小色块贴片，沿用资源卡同款（粗黑边 + 硬投影），压在最上层 */
.pop{
  position:absolute;right:0;top:100%;margin-top:8px;
  padding:4px 12px;
  background:var(--panel);color:var(--ink);
  border:2px solid var(--line);border-radius:calc(8px * var(--r));
  box-shadow:4px 4px 0 var(--line);
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
  white-space:nowrap;opacity:0;pointer-events:none;z-index:7;
  transform:translateY(-10px);
  transition:opacity .28s ease,transform .28s ease;
}
.pop.up{background:var(--c4)}          /* 涨：草绿色块 */
.pop.down{background:var(--red)}       /* 跌：朱红色块 */
.pop.show{opacity:1;transform:translateY(10px)}
/* 搬运开始后：固定 0.25s 上移淡出，不等待数字减到 0 */
.pop.out{opacity:0;transform:translateY(-16px);transition:opacity .25s ease,transform .25s ease}
.pop.up,.pop.down{color:var(--ink)}   /* 数字统一黑色，色块本身表示涨跌 */
.c-morale{color:var(--ma)} .c-funds{color:var(--go)}
.c-qual{color:var(--bl)} .c-sched{color:var(--gr)}
/* 事件卡 */
.card{background:var(--panel2);border:var(--bw) solid var(--line);border-radius:calc(22px * var(--r));padding:32px;min-height:336px;display:flex;flex-direction:column;gap:19px;box-shadow:var(--shadow-card);-webkit-backdrop-filter:var(--panel-blur);backdrop-filter:var(--panel-blur)}
/* 换牌：外框固定不动，只有内部内容淡入淡出 + 轻微位移 */
.card .tag,.card h2,.card p,.card .face,.card .side,
.card .mid-stats{transition:opacity .075s ease,transform .075s ease}
.card.flip .tag,.card.flip h2,.card.flip p,
.card.flip .face,.card.flip .side{opacity:0;transform:translateY(10px)}
.card.flip .mid-stats{opacity:0;transform:translateX(-50%) translateY(10px)}
.card .tag{font-size:18px;color:var(--cy);letter-spacing:1px;text-transform:uppercase}
.card h2{font-size:30px;line-height:1.35}
.card p{font-size:22px;color:var(--dim);line-height:1.6}
/* ===== 决策卡：一次一张，画面由 Canvas 即时随机生成 ===== */
.deck{
  position:relative;width:100%;aspect-ratio:var(--ratio);height:auto;
  border:var(--bw) solid var(--line);border-radius:calc(19px * var(--r));overflow:hidden;background:var(--face-bg);
  user-select:none;transition:border-color .2s;
}
.deck.hl{border-color:var(--bl)} .deck.hr{border-color:var(--red)}
.face{position:absolute;inset:0}
.face canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.face::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  /* 卡面已是扁平拼贴，遮罩只做轻微提亮，别盖掉画面 */
  background:linear-gradient(180deg,rgba(var(--face-veil),.35) 0%,rgba(var(--face-veil),.1) 28%,transparent 48%,rgba(var(--face-veil),.25) 80%,rgba(var(--face-veil),.55) 100%);
}
.hit{position:absolute;top:0;bottom:0;width:50%;z-index:4;cursor:pointer}
.hit.l{left:0} .hit.r{right:0}
/* 侧内容：左＝标题左上，右＝标题右上 */
.side{
  position:absolute;top:0;bottom:0;width:50%;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-start;padding:19px 22px;
}
.side.l{left:0;align-items:flex-start;text-align:left}
.side.r{right:0;align-items:flex-end;text-align:right}
.opt-title{
  display:flex;align-items:flex-start;gap:11px;max-width:100%;
  font-size:22px;font-weight:700;color:var(--face-ink);line-height:1.4;
  /* 黑字 + 八向白描边 + 柔和彩色外发光；参考图：描边实、发光淡而分散 */
  --glow:var(--bl-rgb);              /* 默认蓝色（左） */
  text-shadow:
    /* 八向白描边（2px 厚），完全垫在字身外 */
    1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,
    1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff,
    2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,
    2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,
    /* 彩色外发光 */
    0 0 4px rgba(var(--glow),.45),
    0 0 9px rgba(var(--glow),.28),
    0 0 16px rgba(var(--glow),.15);
}
.side.r .opt-title{flex-direction:row-reverse}
.side.r .opt-title{--glow:var(--red-rgb)}    /* 右侧发光：红色 */
.opt-title .k{
  flex:none;
  font-size:30px;font-weight:800;color:var(--face-ink);line-height:1;
}
/* 属性名居中只显示一份，左右数值贴其两侧 */
.mid-stats{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;pointer-events:none;
  display:grid;gap:4px;padding:16px 6px;
  /* 不再垫背景板：字身统一黑色，描边与外发光用各自的标识色（--c） */
  font-size:18px;font-variant-numeric:tabular-nums;line-height:1.5;color:var(--face-ink);
  --c:var(--face-ink);            /* 描边 / 发光色：属性名与数值各自覆盖 */
}
.srow{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:center}
/* 属性名：贴纸徽章 —— 资源色色块 + 黑边 + 硬投影，白字带深描边 */
.srow .nm{
  display:flex;align-items:center;justify-content:center;
  font-weight:800;text-align:center;color:var(--ink);
  background:var(--c);
  border:2px solid var(--line);
  border-radius:calc(6px * var(--r));
  padding:2px 7px;
  box-shadow:3px 3px 0 var(--line);
  -webkit-text-stroke:0;
}
/* 数值：字黑，描边+发光 = 涨/跌色 */
.srow .vl{
  display:flex;align-items:center;font-weight:800;font-size:27px;   /* 18px × 1.5 */
  font-variant-numeric:tabular-nums;color:var(--face-ink);
  /* 白描边改用多层 text-shadow 实现：贴住字身，彩色发光排在其后（更靠外） */
  text-shadow:
    1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,
    1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff,
    0 0 3px var(--c),0 0 6px var(--c),0 1px 4px var(--c);
}
.srow .vl i{font-style:normal}
.srow .vl .s{margin:0 6px;display:inline-block;width:.66em;text-align:center}      /* 数字与 +/- 之间的间隔；符号等宽盒，使 - 与 + 视觉一致 */
.srow .vl.l{justify-self:end}    /* 同意的数值靠向属性名 */
.srow .vl.r{justify-self:start}  /* 不同意的数值靠向属性名 */
.srow .nm{justify-self:center}    /* 属性名居中 */
.srow .vl.d-up{--c:var(--f-gr)} .srow .vl.d-down{--c:var(--f-red)}
/* 该侧无变化：数值留空（隐藏但仍占位，保持列宽稳定） */
.srow .vl.neu{visibility:hidden}
.delta{padding:3px 8px;border-radius:calc(6px * var(--r));font-size:18px;font-weight:700}
.d-up{color:var(--f-gr)} .d-down{color:var(--f-red)} .d-neu{color:var(--dim)}
/* 提示 toast：浮在卡面内，宽度小于卡面；背后有模糊遮罩 */
.veil{
  position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .25s;
  background:rgba(var(--face-veil),.42);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.veil.show{opacity:1}
.toast{
  position:absolute;left:22px;right:22px;top:50%;
  transform:translateY(-50%) translateY(13px);
  background:rgba(var(--face-veil),.72);border:1px solid var(--face-line);color:var(--face-ink);
  padding:16px 22px;border-radius:calc(16px * var(--r));font-size:19px;line-height:1.55;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:var(--shadow-pop);
}
.toast.show{opacity:1;transform:translateY(-50%)}
.toast .t-pick{font-weight:700;color:var(--cy);margin-bottom:6px}
/* 属性变化作为最后一行，单行不换行 */
.toast .t-deltas{
  display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;
  gap:6px;margin-top:10px;
}
.toast .t-deltas .delta{font-size:16px;padding:3px 6px;white-space:nowrap}
.hint{text-align:center;font-size:18px;color:var(--dim)}
.hint kbd{background:var(--panel);border:var(--bw) solid var(--line);border-radius:calc(6px * var(--r));padding:0 10px}
/* 结局遮罩 */
.overlay{position:fixed;inset:0;background:var(--ov);display:none;align-items:center;justify-content:center;z-index:30;padding:32px}
.overlay.show{display:flex}
.modal{max-width:832px;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:calc(26px * var(--r));padding:45px;text-align:center;-webkit-backdrop-filter:var(--panel-blur);backdrop-filter:var(--panel-blur);box-shadow:var(--shadow-card)}
.modal .verdict{font-size:21px;letter-spacing:3px;margin-bottom:16px}
.modal .verdict.win{color:var(--gr)} .modal .verdict.fail{color:var(--red)}
.modal h1{font-size:42px;margin-bottom:16px;line-height:1.3}
.modal p{color:var(--dim);font-size:22px;line-height:1.7;margin-bottom:10px}
.modal .meta{color:var(--dim);font-size:19px;margin:19px 0}
.modal .statline{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:16px 0 29px;font-size:19px;color:var(--dim)}
.modal .statline b{color:var(--ink)}
button.play{background:var(--cy);color:var(--on-cy);border:none;border-radius:calc(16px * var(--r));padding:19px 42px;font-family:var(--font);font-size:22px;font-weight:700;cursor:pointer}
button.play:hover{filter:brightness(1.1)}
.splash .em{font-size:64px;color:var(--cy);margin-bottom:13px}

/* ===== 孟菲斯质感：放在结构规则之后，确保覆盖默认取值 ===== */
.card{transform:rotate(-.6deg)}                        /* 卡片略微歪一点，手作感 */
.stats .stat{box-shadow:var(--shadow-sm)}
.stats .stat:nth-child(1){background:var(--c1)}
.stats .stat:nth-child(2){background:var(--c2)}
.stats .stat:nth-child(3){background:var(--c3)}
.stats .stat:nth-child(4){background:var(--c4)}
/* 色块本身就是资源标识，卡内文字统一黑色 */
.c-morale,.c-funds,.c-qual,.c-sched{color:var(--ink)}
.prog{background:#FFFFFF;box-shadow:var(--shadow-sm)}
.prog i{background:repeating-linear-gradient(45deg,#FF4B3E 0 10px,#FFD400 10px 20px)}
.card .tag{
  align-self:flex-start;background:var(--go);color:var(--ink);
  border:2px solid var(--line);border-radius:calc(6px * var(--r));
  padding:3px 10px;transform:rotate(-2deg);
}
.card.flip .tag{transform:rotate(-2deg) translateY(10px)}   /* 换牌淡出时保留歪角 */
.card h2{font-weight:800}
.hint kbd{box-shadow:3px 3px 0 var(--line)}
button.play{
  background:var(--go);color:var(--ink);
  border:var(--bw) solid var(--line);box-shadow:6px 6px 0 var(--line);
}
button.play:hover{filter:none;transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--line)}
.modal{box-shadow:12px 12px 0 var(--line)}
.splash .em{color:var(--bl)}

/* 窄屏：开场/结局弹窗字号的兜底（主布局由 zoom 整体缩放，不在此改尺寸） */
@media(max-width:680px){
  /* 开场/结局弹窗是 fixed 定位、不参与整体缩放，单独给小屏尺寸 */
  .overlay{padding:16px}
  .modal{max-width:520px;border-radius:16px;padding:28px}
  .modal .verdict{font-size:13px;letter-spacing:2px;margin-bottom:10px}
  .modal h1{font-size:26px;margin-bottom:10px}
  .modal p{font-size:14px;margin-bottom:6px}
  .modal .meta{font-size:12px;margin:12px 0}
  .modal .statline{gap:16px;margin:10px 0 18px;font-size:12px}
  button.play{border-radius:10px;padding:12px 26px;font-size:14px}
  .splash .em{font-size:40px;margin-bottom:8px}
}
</style>
</head>
<body>
<div class="fit" id="fit">
<div class="wrap">
  <header>
    <div class="logo">INDIE_DEV <span>// 独立制作人</span></div>
    <div class="quarter" id="quarter">第 1 季度</div>
  </header>

  <div>
    <div class="prog-label"><span>项目完成度</span><span id="progPct">0%</span></div>
    <div class="prog"><i id="progFill"></i></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 11a5 5 0 0 0-10 0"/><path d="M12 18h.01"/><path d="M8.5 16a4 4 0 1 0 7 0"/></svg><b class="c-morale">士气</b><span class="num c-morale" id="n-morale">60</span></div>
      <span class="pop" id="p-morale"></span>
    </div>
    <div class="stat">
      <div class="top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M12 7V4"/><circle cx="12" cy="12" r="2.5"/></svg><b class="c-funds">资金</b><span class="num c-funds" id="n-funds">60</span></div>
      <span class="pop" id="p-funds"></span>
    </div>
    <div class="stat">
      <div class="top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.6.8-4.9 4.6 1.4 6.5L12 17.2 6 20.2l1.4-6.5L2.5 9.1l6.6-.8z"/></svg><b class="c-qual">质量</b><span class="num c-qual" id="n-qual">50</span></div>
      <span class="pop" id="p-qual"></span>
    </div>
    <div class="stat">
      <div class="top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b class="c-sched">排期</b><span class="num c-sched" id="n-sched">55</span></div>
      <span class="pop" id="p-sched"></span>
    </div>
  </div>

  <div class="card" id="card">
    <div class="tag">季度决策 · 事件</div>
    <h2 id="evTitle">载入中…</h2>
    <p id="evDesc"></p>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function reset(){
  st={...INIT}; q=1;
  deck=shuffle(EVENTS.map((e,i)=>i));
  prevV=null;
  clearPops();
  updateUI(true);
  nextCard();
  $('overlay').classList.remove('show');
}

function deltaTag(k,d){
  if(!d)return '';
  const cls=d>0?'d-up':d<0?'d-down':'d-neu';
  const sign=d>0?'+':'';
  return `<span class="delta ${cls}" style="background:color-mix(in srgb,${COLORS[k]} 16%,transparent);color:${COLORS[k]}">${NAMES[k]} ${sign}${d}</span>`;
}

/* 变化量飘字：先冒出「+12」停留 2 秒，再把数值一格格搬进资源卡
 * 搬运时长：每格 60ms，总时长夹在 400–900ms（小数值不空等，大数值不拖沓） */
const POP_HOLD=2000, POP_STEP=60, POP_MIN=400, POP_MAX=900;
const moveDur=d=>Math.min(POP_MAX,Math.max(POP_MIN,Math.abs(d)*POP_STEP));
function floatDelta(k,d,from,to){
  const el=$(numEl[k]), pop=$(popEl[k]);
  const sign=d>0?'+':'-';
  pop.textContent=sign+Math.abs(d);
  pop.className='pop show '+(d>0?'up':'down');
  el.textContent=from;                        // 搬运开始前保持旧值
  clearTimeout(pop._t); cancelAnimationFrame(pop._raf);
  const dur=moveDur(d);                       // 按变化量的大小决定搬运时长
  pop._t=setTimeout(()=>{
    pop.classList.add('out');                    // 同步开始下移淡出（固定 0.5s）
    const t0=performance.now();
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur);
      const remain=Math.round(Math.abs(d)*(1-p));
      pop.textContent=sign+remain;                 // 上方逐格减少，始终保留符号
      el.textContent=Math.round(from+(to-from)*p); // 下方数字逐渐增加
      if(p<1) pop._raf=requestAnimationFrame(step);
      else el.textContent=to;                      // 数字到位即可，淡出自行结束
    };
    pop._raf=requestAnimationFrame(step);
  },POP_HOLD);
}
function clearPops(){
  ['mo','fu','qu','sc'].forEach(k=>{
    const pop=$(popEl[k]);
    clearTimeout(pop._t); cancelAnimationFrame(pop._raf);
    pop.className='pop'; pop.textContent='';
  });
}

let prevV=null;
function updateUI(instant){
  ['mo','fu','qu','sc'].forEach(k=>{
    const el=$(numEl[k]), v=st[k];
    if(!instant && prevV && prevV[k]!==v){
      floatDelta(k,v-prevV[k],prevV[k],v);
    }else{
      el.textContent=v;
    }
  });
  prevV={...st};
  $('progFill').style.width=st.pr+'%';
  $('progPct').textContent=st.pr+'%';
  $('quarter').textContent='第 '+q+' 季度';
}

/* ===== 卡面渲染：固定四行属性 + 4 字符等宽 ===== */
/* 属性名配色与资源卡色块一一对应：士气=黄 资金=蓝 质量=粉 排期=绿 进度=紫 */
const ORDER=[
  {k:'mo',n:'士气',c:'var(--c1)'},
  {k:'fu',n:'资金',c:'var(--c2)'},
  {k:'qu',n:'质量',c:'var(--c3)'},
  {k:'sc',n:'排期',c:'var(--c4)'},
  {k:'pr',n:'进度',c:'var(--c5)'},
];
/* 单侧数值：符号贴着属性名，数值在外侧；L = 数值+空格+符号（12 +）；R = 符号+空格+数值（+ 12） */
function cellHTML(d,mode){
  const cls=d>0?'d-up':d<0?'d-down':'neu';
  const sign=d?(d>0?'+':'-'):'-';
  const two=d?String(Math.abs(d)):'--';
  const num=`<i class="n">${two}</i>`, sgn=`<i class="s">${sign}</i>`;
  return `<span class="vl ${mode==='L'?'l':'r'} ${cls}">${mode==='L'?num+sgn:sgn+num}</span>`;
}
/* 中央面板：属性名一份居中，两侧各列自己的数值 */
function midStatsHTML(e){
  // 所有属性行都显示；某侧无变化时该侧数值留空
  return ORDER.map(({k,n,c})=>{
    const dl=e.L.f[k]||0, dr=e.R.f[k]||0;
    const nm=`<span class="nm" style="--c:${c}">${n}</span>`;   /* --c 只喂给描边 / 外发光 */
    return `<span class="srow">`+cellHTML(dl,'L')+nm+cellHTML(dr,'R')+`</span>`;
  }).join('');
}
/* 两侧只保留标题 */
function sideHTML(mode,o){
  const key=mode==='L'?'⬅':'➡';
  return `<div class="opt-title"><span class="k">${key}</span><span>${o.l}</span></div>`;
}

/* 卡面画面：每次出牌随机生成（Canvas，无图片文件） */
const deckCv=$('deckCv');
let faceSeed=(Math.random()*1e9)|0;
function paintFace(s){ if(window.drawFacet) drawFacet(deckCv,s,FACE_PAL); }
if(window.ResizeObserver) new ResizeObserver(()=>paintFace(faceSeed)).observe(deckCv);
else window.addEventListener('resize',()=>paintFace(faceSeed));

/* 卡面色板（孟菲斯）：奶白底上的湖蓝/朱红几何块 */
const FACE_PAL={
  blues:['#2EC4FF','#1DA3DB','#5ED6FF','#0E82B5','#8FE6FF'],
  reds:['#FF4B3E','#DB2E22','#FF7A70','#B31E14','#FFA79F'],
  accents:['#FFD400','#3DDC97','#FF6FB1'],
  base:'#FFF8EE'
};

function nextCard(){
  if(deck.length===0) deck=shuffle(EVENTS.map((e,i)=>i));
  const idx=deck.shift(); currentEvent=EVENTS[idx];
  const e=currentEvent;
  const card=$('card');
  card.classList.add('flip');
  faceSeed=(Math.random()*1e9)|0;
  // 换牌时收起上一题的提示与遮罩
  $('toast').classList.remove('show');
  $('veil').classList.remove('show');
  setTimeout(()=>{
    $('evTitle').textContent=e.t;
    $('evDesc').textContent=e.d;
    $('sideL').innerHTML=sideHTML('L',e.L);
    $('sideR').innerHTML=sideHTML('R',e.R);
    $('midStats').innerHTML=midStatsHTML(e);
    paintFace(faceSeed);
    card.classList.remove('flip');
  },75);
}

function toast(html,onHide){
  const t=$('toast'), v=$('veil');
  t.innerHTML=html;
  t.classList.add('show'); v.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(()=>{
    t.classList.remove('show'); v.classList.remove('show');
    if(onHide) onHide();          // 提示完全收起后再换牌
  },1800);
}

function checkEnd(){
  if(st.pr>=100){ endGame(true); return true; }
  for(const k of ['mo','fu','qu','sc']){
    if(st[k]<=MIN){ endGame(false,FAILS[k]); return true; }
    if(st[k]>=MAX){ endGame(false,OVERFLOW[k]); return true; }
  }
  return false;
}

function choose(side){
  if(busy||!st)return; busy=true;
  const e=currentEvent;
  const opt=side==='L'?e.L:e.R;
  const deltas={};
  Object.keys(opt.f).forEach(k=>{ st[k]=clamp(st[k]+opt.f[k]); deltas[k]=opt.f[k]; });
  updateUI(false);
  const ended=checkEnd();
  q++;
  const pick=`<div class="t-pick">${side==='L'?'← ':'→ '}${opt.l}</div>`;
  const html=pick+`<div>${opt.r}</div>`+
    `<div class="t-deltas">${Object.keys(deltas).map(k=>deltaTag(k,deltas[k])).join('')}</div>`;
  // 提示收起后再切下一张卡
  if(!ended) toast(html,()=>{ nextCard(); busy=false; });
  else toast(html);
}

function endGame(win,fail){
  const ov=$('overlay');
  $('vVerdict').className='verdict '+(win?'win':'fail');
  $('vVerdict').textContent=win?'PROJECT SHIPPED':'PROJECT FAILED';
  $('vTitle').textContent=win?WIN.t:(fail?fail.t:'项目终止');
  $('vDesc').textContent=win?WIN.d:(fail?fail.d:'');
  $('vStats').innerHTML=KEYS.map(k=>`<span>${NAMES[k]} <b>${st[k]}</b></span>`).join('')+`<span>坚持 <b>${q}</b> 季度</span>`;
  ov.classList.add('show');
}

/* 当前事件（nextCard 写入，choose 读取） */
let currentEvent=null;

/* 卡面左右半区点击 */
const deckEl=$('deck');
document.querySelectorAll('.hit').forEach(h=>{
  h.addEventListener('mouseenter',()=>{
    deckEl.classList.toggle('hl',h.dataset.side==='L');
    deckEl.classList.toggle('hr',h.dataset.side==='R');
  });
  h.addEventListener('click',()=>choose(h.dataset.side));
});
deckEl.addEventListener('mouseleave',()=>{ deckEl.classList.remove('hl','hr'); });

$('start').addEventListener('click',()=>{ $('splash').classList.remove('show'); reset(); });
$('vPlay').addEventListener('click',()=>{ $('overlay').classList.remove('show'); reset(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')choose('L');
  if(e.key==='ArrowRight')choose('R');
});

/* ===== 自适应：宽或高装不下时，整页像图片一样等比缩小（含文字、弹窗），只缩不放 ===== */
const DESIGN_W=624, PAD=26, STAGE_W=DESIGN_W+PAD*2;   // 设计稿舞台宽度（含页边距）
const fitEl=$('fit');
const canZoom=window.CSS&&CSS.supports&&CSS.supports('zoom','.5');
function fitUI(){
  if(canZoom) document.documentElement.style.zoom='';   // 先还原再测，避免叠加缩放
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  const w=fitEl.offsetWidth||DESIGN_W, h=fitEl.offsetHeight;
  if(!h) return;
  const stageH=h+PAD*2;                                 // 内容自然高度 + 页边距
  const s=Math.min(1,vw/STAGE_W,vh/stageH);             // 宽、高任一装不下都缩，且不超过 1
  if(canZoom){
    if(s<1) document.documentElement.style.zoom=s;
    return;
  }
  /* 兜底：不支持 zoom 的浏览器，用 transform 整体缩放主容器 */
  fitEl.style.transform=''; fitEl.style.marginBottom=''; fitEl.style.marginRight='';
  const availW=vw-PAD*2, availH=vh-PAD*2, sf=Math.min(1,availW/w,availH/h);
  if(sf<1){
    fitEl.style.transform='scale('+sf+')';
    fitEl.style.marginBottom=(-h*(1-sf))+'px';
    fitEl.style.marginRight=(-w*(1-sf))+'px';
  }
}
window.addEventListener('resize',fitUI);
if(window.ResizeObserver) new ResizeObserver(fitUI).observe(fitEl);

reset();
fitUI();

</script>
