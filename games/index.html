  <script src="../js/theme.js?v=1.0"></script>
  <script>
    var games = [
      { href: "tetris/", name: "俄罗斯方块", desc: "NES 经典风格俄罗斯方块，支持墙踢偏移与中英文切换" }
    ];

    var searchInput = document.getElementById("searchInput");

    function renderGames(filter) {
      var grid = document.getElementById("gameGrid");
      grid.innerHTML = "";
      var q = (filter || "").toLowerCase();
      games.forEach(function (game) {
        if (q && game.name.toLowerCase().indexOf(q) < 0) return;
        var card = document.createElement("a");
        card.className = "tool-card";
        card.href = game.href;
        card.innerHTML = "<h3>" + game.name + "</h3><p>" + game.desc + "</p>";
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", function () {
      renderGames(this.value);
    });

    renderGames();
  </script>
