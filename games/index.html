  <script>
    var games = [
      { href: "tetris/", name: "俄罗斯方块", desc: "NES 经典风格俄罗斯方块，支持墙踢偏移与中英文切换" },
      { href: "mines/", name: "扫雷", desc: "经典扫雷游戏，支持三档难度、中英文切换、长按标旗" },
      { href: "push_box/", name: "推箱子", desc: "90 关经典推箱子，支持键盘操作、撤销、音效" },
      { href: "7colors/", name: "7Colors", desc: "你 vs 机器人染色对战，吞并相邻同色格，占地多者胜" },
      { href: "battle_plane/", name: "炸飞机", desc: "10×10 棋盘摆 3 架飞机，命中所有敌方机头即获胜的人机对战" },
      { href: "battle_ship/", name: "海战棋", desc: "10×10 棋盘摆 5 艘战舰，击沉全部敌舰即获胜的人机对战" },
      { href: "surakarta/", name: "苏拉卡尔塔", desc: "印尼传统棋 Surakarta，沿四角弧线绕行吃子，支持双人与人机对战" },
      { href: "tic_tac_toe/", name: "井字棋", desc: "你 vs 电脑井字棋，支持普通、超级与终极（九宫大棋盘）三种玩法与三档难度" },
      { href: "othello/", name: "黑白棋", desc: "8×8 经典 Reversi，夹击翻面，支持双人与人机对战及三档 AI 难度" },
      { href: "indie_dev/", name: "独立制作人", desc: "Starfall Demo，一场在星光下的叙事抉择，点击左右两个选项走向不同结局" }
    ];

    var searchInput = document.getElementById("searchInput");
    // 手机端不自动激活搜索框，避免打开页面时弹起键盘
    if (window.matchMedia("(min-width: 768px)").matches) searchInput.focus();

    function renderGames(filter) {
      var grid = document.getElementById("gameGrid");
      grid.innerHTML = "";
      var q = (filter || "").toLowerCase();
      games.forEach(function (game) {
        if (q && game.name.toLowerCase().indexOf(q) < 0) return;
        var card = document.createElement("a");
        card.className = "tool-card";
        card.href = game.href;
        card.innerHTML = "<h3>" + game.name + "</h3><p>" + game.desc + "</p>";
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", function () {
      renderGames(this.value);
    });

    renderGames();
  </script>
