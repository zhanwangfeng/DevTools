  <script>
    var apps = [
      {
        name: "CodeKit",
        desc: "VSCode 全能开发工具包，提升编码效率",
        github: "https://github.com/zhanwangfeng/CodeKitForVSCode",
        vscode: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.code-kit-for-vscode",
        badges: [
          { label: "VS Marketplace", img: "https://vsmarketplacebadges.dev/version-short/zhanwangfeng.code-kit-for-vscode.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.code-kit-for-vscode" },
          { label: "Installs", img: "https://vsmarketplacebadges.dev/installs/zhanwangfeng.code-kit-for-vscode.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.code-kit-for-vscode" }
        ]
      },
      {
        name: "LogFilter",
        desc: "VSCode 日志过滤工具，快速定位关键信息",
        github: "https://github.com/zhanwangfeng/LogFilterForVSCode",
        vscode: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.logfilterpro",
        badges: [
          { label: "VS Marketplace", img: "https://vsmarketplacebadges.dev/version-short/zhanwangfeng.LogFilterPro.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.LogFilterPro" },
          { label: "Installs", img: "https://vsmarketplacebadges.dev/installs/zhanwangfeng.LogFilterPro.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.LogFilterPro" }
        ]
      },
      {
        name: "Tetris",
        desc: "VSCode 俄罗斯方块，编码之余放松一下",
        github: "https://github.com/zhanwangfeng/TetrisForVSCode",
        vscode: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.tetris-pro",
        badges: [
          { label: "VS Marketplace", img: "https://vsmarketplacebadges.dev/version-short/zhanwangfeng.tetris-pro.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.tetris-pro" },
          { label: "Installs", img: "https://vsmarketplacebadges.dev/installs/zhanwangfeng.tetris-pro.svg", href: "https://marketplace.visualstudio.com/items?itemName=zhanwangfeng.tetris-pro" }
        ]
      }
    ];

    var searchInput = document.getElementById("searchInput");

    function renderApps(filter) {
      var grid = document.getElementById("appGrid");
      grid.innerHTML = "";
      var q = (filter || "").toLowerCase();
      apps.forEach(function (app) {
        if (q && app.name.toLowerCase().indexOf(q) < 0) return;
        var card = document.createElement("div");
        card.className = "tool-card";
        var badgesHtml = (app.badges || []).map(function (b) {
          return '<a href="' + b.href + '" target="_blank" rel="noopener"><img src="' + b.img + '" alt="' + b.label + '" /></a>';
        }).join("");
        card.innerHTML =
          '<h3><a href="' + app.vscode + '" target="_blank" rel="noopener">' + app.name + '</a></h3>' +
          '<p>' + app.desc + '</p>' +
          '<div class="app-links">' +
            '<a href="' + app.github + '" target="_blank" rel="noopener">GitHub</a>' +
            '<a href="' + app.vscode + '" target="_blank" rel="noopener">VSCode 市场</a>' +
          '</div>' +
          '<div class="app-badges">' + badgesHtml + '</div>';
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", function () {
      renderApps(this.value);
    });

    renderApps();
  </script>
