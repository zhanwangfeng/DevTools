      },
      {
        name: "CodeJson",
        icon: "CJ",
        type: "website",
        desc: "开发者工具箱开源项目，集成 JSON 解析、编解码、哈希等实用工具",
        github: "https://github.com/zhanwangfeng/DevTools",
        website: "https://codejson.cn/",
      }
    ];

    var searchInput = document.getElementById("searchInput");

    var typeColors = {
      "vscode-tool": "app-icon--vscode-tool",
      "vscode-game": "app-icon--vscode-game",
      "website": "app-icon--website"
    };

    function renderApps(filter) {
      var grid = document.getElementById("appGrid");
      grid.innerHTML = "";
      var q = (filter || "").toLowerCase();
      apps.forEach(function (app) {
        if (q && app.name.toLowerCase().indexOf(q) < 0) return;
        var card = document.createElement("div");
        card.className = "tool-card";
        var badgesHtml = (app.badges || []).map(function (b) {
          return '<a href="' + b.href + '" target="_blank" rel="noopener"><img src="' + b.img + '" alt="' + b.label + '" /></a>';
        }).join("");
        var primaryHref = app.vscode || app.website || app.github;
        var linksHtml = '<a href="' + app.github + '" target="_blank" rel="noopener">GitHub</a>';
        if (app.vscode) {
          linksHtml += '<a href="' + app.vscode + '" target="_blank" rel="noopener">VSCode 市场</a>';
        }
        if (app.website) {
          linksHtml += '<a href="' + app.website + '" target="_blank" rel="noopener">官网</a>';
        }
        var iconClass = "app-icon " + (typeColors[app.type] || "");
        card.innerHTML =
          '<div class="app-card-head">' +
            '<div class="' + iconClass + '">' + app.icon + '</div>' +
            '<h3><a href="' + primaryHref + '" target="_blank" rel="noopener">' + app.name + '</a></h3>' +
          '</div>' +
          '<p>' + app.desc + '</p>' +
          '<div class="app-links">' + linksHtml + '</div>' +
          '<div class="app-badges">' + badgesHtml + '</div>';
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", function () {
      renderApps(this.value);
    });

    renderApps();
  </script>
