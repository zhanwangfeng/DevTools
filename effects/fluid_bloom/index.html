<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>点击喷彩雾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1f21; }
  body { cursor: crosshair; }
  #background {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.55);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 0.08em;
    pointer-events: none;
    user-select: none;
    transition: opacity 0.6s ease;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="background"></canvas>
<p class="hint" id="hint">点击任意位置，喷出一团彩雾</p>
<script>
  window.config = {
    SIM_RESOLUTION: 128,
    DYE_RESOLUTION: 1024,
    CAPTURE_RESOLUTION: 512,
    DENSITY_DISSIPATION: 1.3,
    VELOCITY_DISSIPATION: 0.25,
    PRESSURE: 0.8,
    PRESSURE_ITERATIONS: 20,
    CURL: 30,
    SPLAT_RADIUS: 0.18,
    SPLAT_FORCE: 6000,
    SHADING: true,
    COLORFUL: true,
    COLOR_UPDATE_SPEED: 10,
    PAUSED: false,
    BACK_COLOR: { r: 30, g: 31, b: 33 },
    TRANSPARENT: false,
    BLOOM: true,
    BLOOM_ITERATIONS: 8,
    BLOOM_RESOLUTION: 256,
    BLOOM_INTENSITY: 0.35,
    BLOOM_THRESHOLD: 0.7,
    BLOOM_SOFT_KNEE: 0.7,
    SUNRAYS: true,
    SUNRAYS_RESOLUTION: 196,
    SUNRAYS_WEIGHT: 1.0,
    SPRAY_FORCE: 320,
    SPRAY_PARTICLES: 2,
    SPRAY_DURATION: 0.45,
    SPRAY_SPREAD: 0.5,
    SPRAY_TRAVEL: 0.13,
    SPRAY_RADIUS: 0.06,
    SPRAY_COLOR: 0.18,
    SPRAY_MAX: 10
  };
</script>
<script src="js/background.js"></script>
<script>
  const hint = document.getElementById("hint");
  window.addEventListener("pointerdown", () => hint.classList.add("hidden"), { once: true });
</script>
</body>
</html>
